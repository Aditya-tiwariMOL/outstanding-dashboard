<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outstanding Receivables</title>

<style>
:root {
  --mol-blue:#1f4ea3;
  --bg:#f4f6fb;
  --card:#fff;
  --success:#1a7f37;
  --danger:#c62828;
  --grid:rgba(0,0,0,.06);
}

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
}

/* ================= LOGIN ================= */
.login-overlay {
  position:fixed;
  inset:0;
  background:#f4f6fb;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.login-box {
  background:#fff;
  padding:30px 26px;
  border-radius:10px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.login-box img {
  max-width:150px;
  margin-bottom:12px;
}

.login-box h2 {
  font-size:16px;
  color:var(--mol-blue);
  margin-bottom:16px;
}

.login-box input,
.login-box button {
  width:100%;
  max-width:260px;
  margin:0 auto 12px;
  display:block;
  padding:10px;
  font-size:15px;
}

.login-box button {
  background:var(--mol-blue);
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

.login-error {
  color:#c62828;
  font-size:12px;
  display:none;
}

/* ================= HEADER ================= */
.header-wrap {
  text-align:center;
  margin:16px 0 14px;
}

.header-wrap h1 {
  margin:0;
  font-size:20px;
  color:var(--mol-blue);
  font-weight:600;
}

.summary .amount {
  font-size:17px;
  font-weight:600;
}

.summary .date {
  font-size:11px;
  color:#777;
}

/* ================= TABLE ================= */
.table-wrapper {
  overflow-x:auto;
  padding:0 12px 30px;
}

.row {
  display:grid;
  grid-template-columns:
    2fr 1.1fr 1fr 0.9fr 0.9fr 0.9fr 0.9fr 1fr;
  gap:6px;
  padding:10px;
  min-width:900px;
  background:#fff;
  border-bottom:1px solid var(--grid);
  font-size:18px;
}

.row > div {
  border-right:1px solid var(--grid);
  padding-right:6px;
}
.row > div:last-child { border-right:none; }

.header {
  background:var(--mol-blue);
  color:#fff;
  font-weight:bold;
  border-radius:6px;
}

.card {
  background:#fff;
  border-radius:6px;
  margin-top:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.customer { background:#eef3ff; }

.invoice {
  padding-left:18px;
  background:#E5FDEB;
  border-left:3px solid rgba(26,127,55,.18);
  font-size:16px;
}

.hidden { display:none; }

.on-account { color:var(--success); font-weight:bold; }
.overdue { color:var(--danger); font-weight:bold; }

.editable-value {
  color:var(--mol-blue);
  border-bottom:1px dashed rgba(31,78,163,.4);
  cursor:pointer;
}

.editable-placeholder {
  color:#999;
  font-style:italic;
  cursor:pointer;
}

@media (max-width:768px) {
  .row {
    grid-template-columns:
      150px 80px 75px 65px 65px 65px 65px 90px;
    min-width:670px;
    font-size:15px;
  }
}

/* ================= DRAWER ================= */
.drawer {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:10000;
}

.drawer.hidden { display:none; }

.drawer-content {
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:16px;
  border-radius:14px 14px 0 0;
  max-height:90vh;
  overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom);
}

.drawer-title {
  font-size:16px;
  font-weight:bold;
}

.drawer-sub {
  font-size:13px;
  color:#666;
  margin-bottom:12px;
}

.drawer-content input {
  width:100%;
  padding:10px;
  font-size:16px;
  margin-bottom:14px;
}

.drawer-actions {
  display:flex;
  gap:10px;
}

.drawer-actions button {
  flex:1;
  padding:10px;
  font-size:15px;
}

.drawer-actions .primary {
  background:var(--mol-blue);
  color:#fff;
  border:none;
}

/* ================= TOAST ================= */
.toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--mol-blue);
  color:#fff;
  padding:10px 18px;
  border-radius:20px;
  display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <img src="https://raw.githubusercontent.com/Aditya-tiwariMOL/outstanding-dashboard/main/MOL%20Logo%2001.png">
    <h2>MOL LOGISTICS (INDIA) PVT LTD</h2>
    <input type="password" id="pwd" placeholder="Enter access code">
    <button onclick="checkPassword()">Submit</button>
    <div class="login-error" id="loginError">Invalid access code</div>
  </div>
</div>

<!-- APP -->
<div id="appContainer" style="display:none;">
  <div class="header-wrap">
    <h1>Outstanding Receivables</h1>
    <div class="summary">
      <div class="amount" id="netOutstanding">—</div>
      <div class="date" id="lastUpdated">—</div>
    </div>
  </div>

  <div class="table-wrapper">
    <div class="row header">
      <div>Name</div><div>Total OS</div><div>On Acc</div>
      <div>90+</div><div>60+</div><div>30+</div><div>1+</div><div>Fcst</div>
    </div>
    <div id="app"></div>
  </div>
</div>

<!-- DRAWER -->
<div id="forecastDrawer" class="drawer hidden">
  <div class="drawer-content">
    <div class="drawer-title" id="drawerCustomer">—</div>
    <div class="drawer-sub" id="drawerTotal">—</div>
    <input type="number" id="drawerInput" placeholder="Enter forecast amount">
    <div class="drawer-actions">
      <button onclick="closeDrawer()">Cancel</button>
      <button class="primary" onclick="saveDrawerForecast()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Forecast updated</div>

<script>
/* ================= GLOBAL STATE ================= */
let openCustomer = null;
let drawerPIC = null;
let drawerCustomerName = null;
let preloadedData = null;

/* ================= CONFIG ================= */
const API_URL =
"https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

const PASSWORD_HASH =
"46d29dfc245f5708edf4d74c58551f5d4bcf0284690b478ecf7e8c021cb0c2f5";

const isMobile = window.innerWidth <= 768;

/* ================= DATA PROMISE ================= */
const dataPromise = fetch(API_URL).then(r => r.json());

/* ================= UTILS ================= */
const n = v => Number(String(v||0).replace(/,/g,""));
const fmt = v => isMobile && n(v)>=1000 ? Math.round(n(v)/1000)+"K" : n(v).toLocaleString();
const sum = t => n(t["90+"])+n(t["61-90"])+n(t["31-60"])+n(t["1-30"]);

/* ================= AUTH ================= */
async function sha256(t){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

async function checkPassword(){
  if(await sha256(pwd.value.trim()) !== PASSWORD_HASH){
    loginError.style.display="block";
    return;
  }

  loginOverlay.style.display="none";
  appContainer.style.display="block";

  if(!preloadedData){
    preloadedData = await dataPromise;
  }

  render(preloadedData);
  updateSummary(preloadedData);
}

/* ================= SUMMARY ================= */
function updateSummary(data){
  let t=0,o=0;
  data.forEach(p=>{
    t+=sum(p.totals);
    Object.values(p.customers).forEach(c=>o+=n(c.onAccount));
  });
  netOutstanding.innerText="Net Outstanding: ₹"+fmt(t-o);
  lastUpdated.innerText="Last refreshed: "+new Date().toLocaleString();
}

/* ================= DRAWER ================= */
function openDrawer(pic, customer, total, forecast){
  drawerPIC = pic;
  drawerCustomerName = customer;

  drawerCustomer.innerText = customer;
  drawerTotal.innerText = "Total OS: ₹"+fmt(total);

  drawerInput.value = forecast || "";
  forecastDrawer.classList.remove("hidden");

  requestAnimationFrame(()=>{
    drawerInput.focus();
    drawerInput.scrollIntoView({block:"center"});
  });
}

function closeDrawer(){
  forecastDrawer.classList.add("hidden");
}

function saveDrawerForecast(){
  saveForecast(drawerPIC, drawerCustomerName, drawerInput.value);
  closeDrawer();
}

/* ================= RENDER ================= */
function render(data){
  app.innerHTML="";
  let openPIC=null;
  openCustomer=null;

  data.forEach(pic=>{
    const card=document.createElement("div");
    card.className="card";

    const picRow=document.createElement("div");
    picRow.className="row";
    picRow.innerHTML=`
      <div>${pic.salesPIC}</div>
      <div>${fmt(sum(pic.totals))}</div>
      <div></div>
      <div class="overdue">${fmt(pic.totals["90+"])}</div>
      <div>${fmt(pic.totals["61-90"])}</div>
      <div>${fmt(pic.totals["31-60"])}</div>
      <div>${fmt(pic.totals["1-30"])}</div>
      <div></div>`;

    const wrap=document.createElement("div");
    wrap.className="hidden";

    picRow.onclick=()=>{
      if(openPIC && openPIC!==wrap) openPIC.classList.add("hidden");
      wrap.classList.toggle("hidden");
      openPIC = wrap.classList.contains("hidden") ? null : wrap;
      openCustomer=null;
    };

    Object.values(pic.customers).forEach(c=>{
      const r=document.createElement("div");
      r.className="row customer";

      const invoiceWrap=document.createElement("div");
      invoiceWrap.className="hidden";

      r.innerHTML=`
        <div>${c.customerName}</div>
        <div>${fmt(sum(c.totals))}</div>
        <div class="on-account">${fmt(c.onAccount)}</div>
        <div class="overdue">${fmt(c.totals["90+"])}</div>
        <div>${fmt(c.totals["61-90"])}</div>
        <div>${fmt(c.totals["31-60"])}</div>
        <div>${fmt(c.totals["1-30"])}</div>
        <div>
  ${
    isMobile
      ? `
        <span class="${c.forecast?'editable-value':'editable-placeholder'}"
          onclick="event.stopPropagation();
          openDrawer(
            '${pic.salesPIC}',
            '${c.customerName}',
            '${sum(c.totals)}',
            '${c.forecast||""}'
          )">
          ${c.forecast ? fmt(c.forecast) : 'Add'}
        </span>
      `
      : `
        <input type="text"
          value="${c.forecast || ''}"
          placeholder="Enter"
          onclick="event.stopPropagation()"
          onchange="saveForecast(
            '${pic.salesPIC}',
            '${c.customerName}',
            this.value
          )"
          style="
            width:100%;
            padding:6px;
            font-size:14px;
            box-sizing:border-box;
          "
        />
      `
  }
</div>
      r.onclick=()=>{
        if(openCustomer && openCustomer!==invoiceWrap){
          openCustomer.classList.add("hidden");
        }
        invoiceWrap.classList.toggle("hidden");
        openCustomer = invoiceWrap.classList.contains("hidden") ? null : invoiceWrap;
      };

      c.invoices.forEach(i=>{
        const inv=document.createElement("div");
        inv.className="row invoice";
        inv.innerHTML=`
          <div>${i.invoiceNo}</div>
          <div>${fmt(i.total)}</div>
          <div></div>
          <div>${fmt(i.ageing["90+"]||0)}</div>
          <div>${fmt(i.ageing["61-90"]||0)}</div>
          <div>${fmt(i.ageing["31-60"]||0)}</div>
          <div>${fmt(i.ageing["1-30"]||0)}</div>
          <div></div>`;
        invoiceWrap.appendChild(inv);
      });

      wrap.appendChild(r);
      wrap.appendChild(invoiceWrap);
    });

    card.appendChild(picRow);
    card.appendChild(wrap);
    app.appendChild(card);
  });
}

/* ================= SAVE ================= */
function saveForecast(pic,customer,value){
  const val=n(value);
  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"updateForecast",
      salesPIC:pic,
      customer,
      forecast:val
    })
  }).then(()=>{
    preloadedData.forEach(p=>{
      if(p.salesPIC===pic){
        Object.values(p.customers).forEach(c=>{
          if(c.customerName===customer) c.forecast=val;
        });
      }
    });
    render(preloadedData);
    updateSummary(preloadedData);
    toast.style.display="block";
    setTimeout(()=>toast.style.display="none",2000);
  });
}
</script>

</body>
</html>
