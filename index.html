<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
/* ================= THEME ================= */
:root {
  --mol-blue: #1f4ea3;
  --bg: #f4f6fb;
  --card: #ffffff;
  --danger: #c62828;
}

/* ================= BASE ================= */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #111;
}

/* ================= HEADER ================= */
h1 {
  text-align: center;
  color: var(--mol-blue);
  margin: 18px 0 6px;
  font-size: 26px;
}

.summary {
  text-align: center;
  margin-bottom: 18px;
}

.summary .amount {
  font-size: 22px;
  font-weight: bold;
}

.summary .date {
  font-size: 12px;
  color: #555;
}

/* ================= TABLE WRAPPER ================= */
.table-wrapper {
  overflow-x: auto;
  padding: 0 16px 40px;
}

/* ================= DESKTOP TABLE ================= */
.row {
  display: grid;
  grid-template-columns:
    2.5fr   /* Name */
    1fr     /* Total */
    1fr     /* On Account */
    0.8fr   /* 90+ */
    0.8fr   /* 60–90 */
    0.8fr   /* 30–60 */
    1fr;    /* Forecast */
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  font-size: 14px;
}

/* ================= HEADER ROW ================= */
.header {
  background: var(--mol-blue);
  color: #fff;
  font-weight: bold;
  border-radius: 8px;
}

/* ================= ROW TYPES ================= */
.card {
  background: var(--card);
  border-radius: 8px;
  margin-top: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.customer {
  background: #eef3ff;
}

.invoice {
  padding-left: 28px;
  font-size: 13px;
}

/* ================= HIGHLIGHTS ================= */
.col-90 {
  color: var(--danger);
  font-weight: bold;
}

/* ================= INPUT ================= */
input {
  width: 100%;
  padding: 6px 8px;
  font-size: 14px;
  box-sizing: border-box;
}

/* ================= UTIL ================= */
.hidden {
  display: none;
}

/* ================= TOAST ================= */
.toast {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--mol-blue);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  display: none;
}

/* =================================================
   MOBILE – DENSE TABLE, BIG TEXT, SCROLL
   ================================================= */
@media (max-width: 768px) {

  h1 {
    font-size: 22px;
  }

  .summary .amount {
    font-size: 20px;
  }

  .table-wrapper {
    padding: 0 10px 30px;
  }

  .row {
    grid-template-columns:
      180px
      90px
      90px
      80px
      80px
      80px
      100px;
    min-width: 700px;
    font-size: 13px;
    padding: 10px;
    gap: 10px;
  }

  .invoice {
    font-size: 12px;
  }

  input {
    font-size: 13px;
    padding: 6px;
  }
}
</style>
</head>

<body>

<h1>Outstanding Receivables</h1>

<div class="summary">
  <div class="amount" id="netOutstanding">—</div>
  <div class="date" id="lastUpdated">Last updated: —</div>
</div>

<div class="table-wrapper">
  <div class="row header">
    <div>Name</div>
    <div>Total</div>
    <div>On Account</div>
    <div>90+</div>
    <div>60–90</div>
    <div>30–60</div>
    <div>Forecast</div>
  </div>

  <div id="app"></div>
</div>

<div class="toast" id="toast">Forecast updated</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

let openPIC = null;
let openCustomer = null;

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    render(data);
    updateSummary(data);
  });

function updateSummary(data) {
  let totalOutstanding = 0;
  let totalOnAccount = 0;

  data.forEach(p => {
    totalOutstanding += sum(p.totals);
    Object.values(p.customers).forEach(c => {
      totalOnAccount += c.onAccount || 0;
    });
  });

  document.getElementById("netOutstanding").innerText =
    "Net Outstanding: ₹" + (totalOutstanding - totalOnAccount);

  document.getElementById("lastUpdated").innerText =
    "Last refreshed: " + new Date().toLocaleString();
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.forEach(pic => {
    const card = document.createElement("div");
    card.className = "card";

    const picRow = document.createElement("div");
    picRow.className = "row";
    picRow.innerHTML = `
      <div>${pic.salesPIC}</div>
      <div>${sum(pic.totals)}</div>
      <div></div>
      <div class="col-90">${pic.totals["90+"]}</div>
      <div>${pic.totals["61-90"]}</div>
      <div>${pic.totals["31-60"]}</div>
      <div></div>
    `;

    const customerContainer = document.createElement("div");
    customerContainer.className = "hidden";

    picRow.onclick = () => toggle(customerContainer, "pic");

    Object.values(pic.customers).forEach(c => {
      const row = document.createElement("div");
      row.className = "row customer";
      row.innerHTML = `
        <div>${c.customerName}</div>
        <div>${sum(c.totals)}</div>
        <div>${c.onAccount || 0}</div>
        <div class="col-90">${c.totals["90+"]}</div>
        <div>${c.totals["61-90"]}</div>
        <div>${c.totals["31-60"]}</div>
        <div>
          <input type="number"
            value="${c.forecast || ""}"
            onclick="event.stopPropagation()"
            onchange="saveForecast('${pic.salesPIC}','${c.customerName}',this.value)">
        </div>
      `;
      customerContainer.appendChild(row);
    });

    card.appendChild(picRow);
    card.appendChild(customerContainer);
    app.appendChild(card);
  });
}

function sum(t) {
  return (t["90+"]||0)+(t["61-90"]||0)+(t["31-60"]||0)+(t["1-30"]||0);
}

function toggle(el, level) {
  if (level==="pic" && openPIC && openPIC!==el) openPIC.classList.add("hidden");
  el.classList.toggle("hidden");
  openPIC = el.classList.contains("hidden") ? null : el;
}

function saveForecast(pic, customer, value) {
  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"updateForecast",salesPIC:pic,customer,forecast:+value})
  }).then(showToast);
}

function showToast() {
  const t=document.getElementById("toast");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}
</script>

</body>
</html>
