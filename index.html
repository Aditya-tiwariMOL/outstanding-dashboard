<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOL Outstanding Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>

/* ================= ROOT ================= */

:root {
  --mol-blue:#1f4ea3;
  --bg:#f7f9fc;
  --card:#ffffff;
  --success:#16a34a;
  --danger:#dc2626;
  --grid:rgba(0,0,0,.05);
  --soft-shadow:0 4px 14px rgba(0,0,0,.06);
}

/* ================= BODY ================= */

body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg);
  color:#333;
}

/* ================= LOGIN ================= */

.login-overlay{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.login-box{
  background:#fff;
  padding:30px;
  width:90%;
  max-width:360px;
  border-radius:12px;
  text-align:center;
  box-shadow:var(--soft-shadow);
}

.login-box img{
  max-width:150px;
  margin-bottom:10px;
}

.login-box input,
.login-box button{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  font-size:15px;
}

.login-box button{
  background:var(--mol-blue);
  border:none;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
}

.login-error{
  color:#dc2626;
  font-size:12px;
  display:none;
}

/* ================= HEADER ================= */

.header-wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
  padding:16px 20px;
  margin:16px 12px;
  border-radius:12px;
  box-shadow:var(--soft-shadow);
}

.header-wrap h1{
  font-size:22px;
  font-weight:600;
  color:var(--mol-blue);
  margin:0;
}

.summary{text-align:right;}

.summary .amount{
  font-size:20px;
  font-weight:700;
  color:var(--mol-blue);
}

.summary .date{
  font-size:12px;
  color:#666;
}

/* ================= TABLE ================= */

.table-wrapper{
  padding:0 12px 30px;
  overflow-x:auto;
}

.row{
  display:grid;
  grid-template-columns:2.2fr 1.1fr 1fr 1fr 1fr 1fr 1fr .9fr;
  gap:8px;
  padding:12px 14px;
  min-width:900px;
  background:#fff;
  border-bottom:1px solid var(--grid);
  font-size:15px;
  align-items:center;
}

.row>div{
  border-right:1px solid var(--grid);
  padding-right:6px;
}

.row>div:last-child{border:none;}

.header{
  background:var(--mol-blue);
  color:#fff;
  font-weight:600;
  border-radius:10px 10px 0 0;
  font-size:14px;
}

.card{
  background:var(--card);
  border-radius:12px;
  margin-top:14px;
  box-shadow:var(--soft-shadow);
  overflow:hidden;
}

/* ================= ACCORDION ================= */

.customer{
  background:#eef3ff;
  font-weight:500;
}

.invoice{
  padding-left:20px;
  background:#f0fdf4;
  border-left:3px solid var(--success);
  font-size:14px;
}

.hidden{display:none;}

.on-account{
  color:var(--success);
  font-weight:600;
}

.overdue{
  color:var(--danger);
  font-weight:600;
}

/* ================= DASHBOARD ================= */

#dashboard{
  padding:20px 12px 60px;
  max-width:1200px;
  margin:auto;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.chart-box{
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:var(--soft-shadow);
  min-height:420px;
}

.chart-box.tall{
  min-height:540px;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

.header-wrap{
  flex-direction:column;
  text-align:center;
  gap:10px;
}

.summary{text-align:center;}

.row{
  grid-template-columns:150px 80px 75px 65px 65px 65px 65px 90px;
  min-width:680px;
  font-size:14px;
}

.dashboard-grid{
  grid-template-columns:1fr;
}

}

/* ================= DRAWER ================= */

.drawer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:10000;
}

.drawer.hidden{display:none;}

.drawer-content{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:20px;
  border-radius:16px 16px 0 0;
  max-height:90vh;
  overflow:auto;
}

.drawer-actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.drawer-actions button{
  flex:1;
  padding:10px;
}

.drawer-actions .primary{
  background:var(--mol-blue);
  color:#fff;
  border:none;
  border-radius:6px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:var(--mol-blue);
  color:#fff;
  padding:10px 20px;
  border-radius:20px;
  display:none;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
<div class="login-box">
<img src="https://raw.githubusercontent.com/Aditya-tiwariMOL/outstanding-dashboard/main/MOL%20Logo%2001.png">
<h3>MOL LOGISTICS (INDIA) PVT LTD</h3>
<input type="password" id="pwd" placeholder="Enter access code">
<button onclick="checkPassword()">Submit</button>
<div class="login-error" id="loginError">Invalid access code</div>
</div>
</div>

<!-- APP -->
<div id="appContainer" style="display:none;">

<div class="header-wrap">
<h1>Receivables Dashboard</h1>
<div class="summary">
<div class="amount" id="netOutstanding">—</div>
<div class="date" id="lastUpdated">—</div>
</div>
</div>

<div class="table-wrapper">
<div class="row header">
<div>Name</div><div>Total OS</div><div>On Acc</div>
<div>90+</div><div>60+</div><div>30+</div><div>1+</div><div>Fcst</div>
</div>
<div id="app"></div>
</div>

<div id="dashboard">

<h2 style="text-align:center;color:var(--mol-blue);margin-bottom:25px;">
Visual Analytics
</h2>

<div class="dashboard-grid">

<div class="chart-box">
<canvas id="ageingChart"></canvas>
</div>

<div class="chart-box tall">
<canvas id="picChart"></canvas>
</div>

</div>

<div class="chart-box tall" style="margin-top:20px;">
<canvas id="defaulterChart"></canvas>
</div>

</div>
</div>

<!-- DRAWER -->
<div id="forecastDrawer" class="drawer hidden">
<div class="drawer-content">

<div id="drawerCustomer" style="font-weight:600;"></div>
<div id="drawerTotal" style="font-size:13px;color:#666;"></div>

<input type="number" id="drawerInput"
style="width:100%;padding:10px;margin-top:10px;">

<div class="drawer-actions">
<button onclick="closeDrawer()">Cancel</button>
<button class="primary" onclick="saveDrawerForecast()">Save</button>
</div>

</div>
</div>

<div class="toast" id="toast">Forecast Updated</div>

<script>

/* ================= FULL SCRIPT ================= */

let preloadedData=null, ageingChartObj=null, picChartObj=null, defaulterChartObj=null;

const API_URL="https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

const PASSWORD_HASH="9f7259520fecfc4f2ae2c2627cd625197070aa7a73d90938c680f8b5aaba747a";

const isMobile=window.innerWidth<=768;

const dataPromise=fetch(API_URL).then(r=>r.json());

const n=v=>Number(String(v||0).replace(/,/g,""));

const fmt=v=>isMobile&&n(v)>=1000?Math.round(n(v)/1000)+"K":n(v).toLocaleString();

const sum=t=>n(t["90+"])+n(t["61-90"])+n(t["31-60"])+n(t["1-30"]);


/* PASSWORD */

async function sha256(t){
const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}


/* LOGIN */

async function checkPassword(){

if(await sha256(pwd.value.trim())!==PASSWORD_HASH){
loginError.style.display="block";
return;
}

loginOverlay.style.display="none";
appContainer.style.display="block";

if(!preloadedData) preloadedData=await dataPromise;

render(preloadedData);
updateSummary(preloadedData);
renderDashboard(preloadedData);

}


/* SUMMARY */

function updateSummary(data){

let t=0,o=0;

data.forEach(p=>{
t+=sum(p.totals);
Object.values(p.customers).forEach(c=>o+=n(c.onAccount));
});

netOutstanding.innerText="₹"+fmt(t-o);
lastUpdated.innerText="Updated: "+new Date().toLocaleString();

}


/* RENDER TABLE */

function render(data){

app.innerHTML="";

let openPIC=null;
let openCustomer=null;

data.forEach(pic=>{

const card=document.createElement("div");
card.className="card";

const picRow=document.createElement("div");
picRow.className="row";

picRow.innerHTML=`
<div>${pic.salesPIC}</div>
<div>${fmt(sum(pic.totals))}</div>
<div></div>
<div class="overdue">${fmt(pic.totals["90+"])}</div>
<div>${fmt(pic.totals["61-90"])}</div>
<div>${fmt(pic.totals["31-60"])}</div>
<div>${fmt(pic.totals["1-30"])}</div>
<div></div>
`;

const wrap=document.createElement("div");
wrap.className="hidden";

picRow.onclick=()=>{

if(openPIC && openPIC!==wrap)
openPIC.classList.add("hidden");

wrap.classList.toggle("hidden");
openPIC=wrap.classList.contains("hidden")?null:wrap;

};


Object.values(pic.customers).forEach(c=>{

const r=document.createElement("div");
r.className="row customer";

const invWrap=document.createElement("div");
invWrap.className="hidden";

r.innerHTML=`
<div>${c.customerName}</div>
<div>${fmt(sum(c.totals))}</div>
<div class="on-account">${fmt(c.onAccount)}</div>
<div class="overdue">${fmt(c.totals["90+"])}</div>
<div>${fmt(c.totals["61-90"])}</div>
<div>${fmt(c.totals["31-60"])}</div>
<div>${fmt(c.totals["1-30"])}</div>
<div>
<span onclick="event.stopPropagation();
openDrawer('${pic.salesPIC}','${c.customerName}','${sum(c.totals)}','${c.forecast||""}')"
style="color:#2563eb;cursor:pointer;">
${c.forecast?fmt(c.forecast):'Add'}
</span>
</div>
`;

r.onclick=()=>{

if(openCustomer && openCustomer!==invWrap)
openCustomer.classList.add("hidden");

invWrap.classList.toggle("hidden");
openCustomer=invWrap.classList.contains("hidden")?null:invWrap;

};


c.invoices.forEach(i=>{

const inv=document.createElement("div");
inv.className="row invoice";

inv.innerHTML=`
<div>${i.invoiceNo}</div>
<div>${fmt(i.total)}</div>
<div></div>
<div>${fmt(i.ageing["90+"]||0)}</div>
<div>${fmt(i.ageing["61-90"]||0)}</div>
<div>${fmt(i.ageing["31-60"]||0)}</div>
<div>${fmt(i.ageing["1-30"]||0)}</div>
<div></div>
`;

invWrap.appendChild(inv);

});

wrap.appendChild(r);
wrap.appendChild(invWrap);

});

card.appendChild(picRow);
card.appendChild(wrap);
app.appendChild(card);

});

}


/* DASHBOARD HELPERS */

function getAgeingTotals(data){

let a1=0,a2=0,a3=0,a4=0;

data.forEach(p=>{
a4+=n(p.totals["90+"]);
a3+=n(p.totals["61-90"]);
a2+=n(p.totals["31-60"]);
a1+=n(p.totals["1-30"]);
});

return[a1,a2,a3,a4];

}

function getPICOutstanding(data){

return data.map(p=>({
name:p.salesPIC,
total:sum(p.totals)
})).sort((a,b)=>b.total-a.total).slice(0,10);

}

function getTopDefaulters(data){

const list=[];

data.forEach(p=>{
Object.values(p.customers).forEach(c=>{
if(n(c.totals["90+"])>0)
list.push({name:c.customerName,amount:n(c.totals["90+"])});
});
});

return list.sort((a,b)=>b.amount-a.amount).slice(0,10);

}


/* DASHBOARD */

function renderDashboard(data){

if(ageingChartObj) ageingChartObj.destroy();
if(picChartObj) picChartObj.destroy();
if(defaulterChartObj) defaulterChartObj.destroy();

const colors={
green:'#22c55e',
yellow:'#eab308',
orange:'#f59e0b',
red:'#ef4444',
blue:'#3b82f6'
};


/* AGEING */

const [a1,a2,a3,a4]=getAgeingTotals(data);

ageingChartObj=new Chart(ageingChart,{
type:"doughnut",
plugins:[ChartDataLabels],
data:{
labels:["1-30","31-60","61-90","90+"],
datasets:[{
data:[a1,a2,a3,a4],
backgroundColor:[colors.green,colors.yellow,colors.orange,colors.red]
}]
},
options:{
maintainAspectRatio:false,
plugins:{
legend:{position:"bottom"},
title:{display:true,text:"Ageing"},
datalabels:{color:"#fff"}
}
}
});


/* PIC */

const pic=getPICOutstanding(data);

picChartObj=new Chart(picChart,{
type:"bar",
plugins:[ChartDataLabels],
data:{
labels:pic.map(p=>p.name),
datasets:[{
data:pic.map(p=>p.total),
backgroundColor:colors.blue
}]
},
options:{
indexAxis:"y",
maintainAspectRatio:false,
plugins:{
legend:{display:false},
title:{display:true,text:"Top PIC"},
datalabels:{anchor:"end",align:"right"}
},
scales:{x:{display:false}}
}
});


/* DEFAULTER */

const top=getTopDefaulters(data);

defaulterChartObj=new Chart(defaulterChart,{
type:"bar",
plugins:[ChartDataLabels],
data:{
labels:top.map(t=>t.name),
datasets:[{
data:top.map(t=>t.amount),
backgroundColor:colors.red
}]
},
options:{
indexAxis:"y",
maintainAspectRatio:false,
plugins:{
legend:{display:false},
title:{display:true,text:"Top Defaulters"},
datalabels:{anchor:"end",align:"right"}
},
scales:{x:{display:false}}
}
});

}


/* DRAWER */

let drawerPIC,drawerCustomerName;

function openDrawer(pic,cust,tot,fcst){

drawerPIC=pic;
drawerCustomerName=cust;

drawerCustomer.innerText=cust;
drawerTotal.innerText="Total: ₹"+fmt(tot);
drawerInput.value=fcst;

forecastDrawer.classList.remove("hidden");

}

function closeDrawer(){
forecastDrawer.classList.add("hidden");
}

function saveDrawerForecast(){
saveForecast(drawerPIC,drawerCustomerName,drawerInput.value);
closeDrawer();
}


/* SAVE FORECAST */

function saveForecast(pic,cust,val){

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"updateForecast",
salesPIC:pic,
customer:cust,
forecast:n(val)
})
})
.then(()=>{

preloadedData.forEach(p=>{
if(p.salesPIC===pic)
Object.values(p.customers).forEach(c=>{
if(c.customerName===cust)
c.forecast=n(val);
});
});

render(preloadedData);
updateSummary(preloadedData);
renderDashboard(preloadedData);

toast.style.display="block";
setTimeout(()=>toast.style.display="none",2000);

});

}

</script>

</body>
</html>
