<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
:root {
  --mol-blue:#1f4ea3;
  --bg:#f4f6fb;
  --card:#ffffff;
  --success:#1a7f37;
  --danger:#c62828;
  --grid:rgba(0,0,0,0.06);
}

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
}

/* ================= HEADER ================= */
.header-wrap {
  text-align:center;
  margin:14px 0 12px;
}

h1 {
  margin:0;
  font-size:22px;
  color:var(--mol-blue);
}

.summary .amount {
  font-size:18px;
  font-weight:bold;
}

.summary .date {
  font-size:11px;
  color:#666;
}

/* ================= TABLE ================= */
.table-wrapper {
  overflow-x:auto;
  padding:0 12px 20px;
}

.row {
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr;
  gap:8px;
  padding:12px;
  min-width:900px;
  background:#fff;
  border-bottom:1px solid var(--grid);
  font-size:18px;
}

.row > div {
  border-right:1px solid var(--grid);
  padding-right:6px;
}
.row > div:last-child { border-right:none; }

.header {
  background:var(--mol-blue);
  color:#fff;
  font-weight:bold;
  border-radius:6px;
}

.card {
  background:var(--card);
  border-radius:6px;
  margin-top:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.customer {
  background:#eef3ff;
}

.invoice {
  padding-left:20px;
  background:#E8F1E9;
  border-left:3px solid rgba(26,127,55,0.18);
  font-size:16px;
}

.hidden { display:none; }

/* ================= COLORS ================= */
.on-account {
  color:var(--success);
  font-weight:bold;
}

.overdue {
  color:var(--danger);
  font-weight:bold;
}

/* ================= INPUT ================= */
input {
  width:100%;
  padding:6px;
  font-size:16px;
}

/* ================= NOTE ================= */
.total-note {
  font-size:11px;
  color:#777;
  text-align:center;
  margin:6px 12px 30px;
}

/* ================= TOAST ================= */
.toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--mol-blue);
  color:#fff;
  padding:10px 18px;
  border-radius:20px;
  display:none;
}

/* ================= MOBILE ================= */
@media (max-width:768px) {
  h1 { font-size:18px; }
  .summary .amount { font-size:16px; }
  .summary .date { font-size:10px; }

  .row {
    font-size:15px;
    padding:12px 6px;
    gap:6px;
    min-width:740px;
  }

  .total-note {
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="header-wrap">
  <h1>Outstanding Receivables</h1>
  <div class="summary">
    <div class="amount" id="netOutstanding">—</div>
    <div class="date" id="lastUpdated">—</div>
  </div>
</div>

<div class="table-wrapper">
  <div class="row header">
    <div>Name</div>
    <div>Total</div>
    <div>On Account</div>
    <div>90+</div>
    <div>60–90</div>
    <div>30–60</div>
    <div>Forecast</div>
  </div>

  <div id="app"></div>
</div>

<div class="total-note">
  * Total outstanding includes 1–30 days bucket (not displayed separately).
</div>

<div class="toast" id="toast">Forecast updated</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";
const isMobile = window.innerWidth <= 768;

/* ===== NUMBER SAFETY ===== */
function toNumber(val) {
  if (val === null || val === undefined || val === "") return 0;
  return Number(String(val).replace(/,/g, ""));
}

function formatNumber(val) {
  const n = toNumber(val);
  if (!isMobile) return n.toLocaleString();
  return n >= 1000 ? Math.round(n / 1000) + "K" : n;
}

function sum(t) {
  return toNumber(t["90+"]) +
         toNumber(t["61-90"]) +
         toNumber(t["31-60"]) +
         toNumber(t["1-30"]);
}

/* ===== FETCH ===== */
fetch(API_URL)
  .then(r => r.json())
  .then(d => {
    render(d);
    updateSummary(d);
  });

function updateSummary(data) {
  let total = 0, onAcc = 0;

  data.forEach(p => {
    total += sum(p.totals);
    Object.values(p.customers).forEach(c => {
      onAcc += toNumber(c.onAccount);
    });
  });

  document.getElementById("netOutstanding").innerText =
    "Net Outstanding: ₹" + formatNumber(total - onAcc);

  document.getElementById("lastUpdated").innerText =
    "Last refreshed: " + new Date().toLocaleString();
}

/* ===== RENDER ===== */
function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";
  let openPIC = null;

  data.forEach(pic => {
    const card = document.createElement("div");
    card.className = "card";

    const picRow = document.createElement("div");
    picRow.className = "row";
    picRow.innerHTML = `
      <div>${pic.salesPIC}</div>
      <div>${formatNumber(sum(pic.totals))}</div>
      <div></div>
      <div class="overdue">${formatNumber(pic.totals["90+"])}</div>
      <div>${formatNumber(pic.totals["61-90"])}</div>
      <div>${formatNumber(pic.totals["31-60"])}</div>
      <div></div>
    `;

    const customerWrap = document.createElement("div");
    customerWrap.className = "hidden";

    picRow.onclick = () => {
      if (openPIC && openPIC !== customerWrap) {
        openPIC.classList.add("hidden");
      }
      customerWrap.classList.toggle("hidden");
      openPIC = customerWrap.classList.contains("hidden") ? null : customerWrap;
      customerWrap.querySelectorAll(".invoice-wrap")
        .forEach(i => i.classList.add("hidden"));
    };

    Object.values(pic.customers).forEach(c => {
      const cRow = document.createElement("div");
      cRow.className = "row customer";
      cRow.innerHTML = `
        <div>${c.customerName}</div>
        <div>${formatNumber(sum(c.totals))}</div>
        <div class="on-account">${formatNumber(c.onAccount)}</div>
        <div class="overdue">${formatNumber(c.totals["90+"])}</div>
        <div>${formatNumber(c.totals["61-90"])}</div>
        <div>${formatNumber(c.totals["31-60"])}</div>
        <div>
          <input type="text"
            value="${c.forecast || ""}"
            onclick="event.stopPropagation()"
            onchange="saveForecast('${pic.salesPIC}','${c.customerName}',this.value)">
        </div>
      `;

      const invWrap = document.createElement("div");
      invWrap.className = "invoice-wrap hidden";

      cRow.onclick = () => {
        const open = !invWrap.classList.contains("hidden");
        customerWrap.querySelectorAll(".invoice-wrap")
          .forEach(i => i.classList.add("hidden"));
        if (!open) invWrap.classList.remove("hidden");
      };

      c.invoices.forEach(i => {
        const r = document.createElement("div");
        r.className = "row invoice";
        r.innerHTML = `
          <div>${i.invoiceNo}</div>
          <div>${formatNumber(i.total)}</div>
          <div></div>
          <div class="overdue">${formatNumber(i.ageing["90+"])}</div>
          <div>${formatNumber(i.ageing["61-90"])}</div>
          <div>${formatNumber(i.ageing["31-60"])}</div>
          <div></div>
        `;
        invWrap.appendChild(r);
      });

      customerWrap.appendChild(cRow);
      customerWrap.appendChild(invWrap);
    });

    card.appendChild(picRow);
    card.appendChild(customerWrap);
    app.appendChild(card);
  });
}

function saveForecast(pic, customer, value) {
  fetch(API_URL, {
    method:"POST",
    body:JSON.stringify({
      action:"updateForecast",
      salesPIC:pic,
      customer:customer,
      forecast: toNumber(value)
    })
  }).then(() => {
    const t = document.getElementById("toast");
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2000);
  });
}
</script>

</body>
</html>
