<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outstanding Receivables</title>

<style>
:root {
  --mol-blue:#1f4ea3;
  --bg:#f4f6fb;
  --card:#fff;
  --success:#1a7f37;
  --danger:#c62828;
  --grid:rgba(0,0,0,.06);
}

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
}

/* LOGIN */
.login-overlay {
  position:fixed;
  inset:0;
  background:#f4f6fb;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.login-box {
  background:#fff;
  padding:30px 26px;
  border-radius:10px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.login-box img {
  max-width:150px;
  margin-bottom:14px;
}

.login-box h2 {
  font-size:16px;
  color:var(--mol-blue);
  margin-bottom:18px;
}

.login-box input,
.login-box button {
  width:100%;
  max-width:260px;
  margin:0 auto 14px;
  display:block;
  padding:10px;
  font-size:15px;
}

.login-box button {
  background:var(--mol-blue);
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

.login-error {
  color:#c62828;
  font-size:12px;
  display:none;
}

/* APP STYLES (unchanged, trimmed for brevity) */
.header-wrap { text-align:center; margin:14px 0; }
h1 { margin:0; font-size:22px; color:var(--mol-blue); }

.table-wrapper { overflow-x:auto; padding:0 12px 20px; }
.row {
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr;
  gap:8px;
  padding:12px;
  min-width:900px;
  background:#fff;
  border-bottom:1px solid var(--grid);
}

.hidden { display:none; }
.on-account { color:var(--success); font-weight:bold; }
.overdue { color:var(--danger); font-weight:bold; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <img src="https://raw.githubusercontent.com/Aditya-tiwariMOL/outstanding-dashboard/main/MOL%20Logo%2001.png">
    <h2>MOL LOGISTICS (INDIA) PVT LTD</h2>
    <input type="password" id="pwd" placeholder="Enter access code">
    <button onclick="checkPassword()">Submit</button>
    <div class="login-error" id="loginError">Invalid access code</div>
  </div>
</div>

<!-- APP -->
<div id="appContainer" style="display:none;">
  <div class="header-wrap">
    <h1>Outstanding Receivables</h1>
  </div>
  <div class="table-wrapper">
    <div id="app"></div>
  </div>
</div>

<script>
/* ===== HARD RESET AUTH ON LOAD ===== */
sessionStorage.removeItem("auth");

/* ===== CONFIG ===== */
const API_URL =
"https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

/* SHA-256 hash of MOL2026 */
const PASSWORD_HASH =
"46d29dfc245f5708edf4d74c58551f5d4bcf0284690b478ecf7e8c021cb0c2f5";

let preloadedData = null;

/* PRELOAD DATA (BUT DO NOT SHOW APP) */
fetch(API_URL)
  .then(r => r.json())
  .then(d => preloadedData = d);

/* HASH */
async function sha256(txt) {
  const buf = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(txt)
  );
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");
}

/* PASSWORD CHECK */
async function checkPassword() {
  const input = document.getElementById("pwd").value.trim();
  if (!input) return; // block empty submit

  const hash = await sha256(input);
  if (hash === PASSWORD_HASH) {
    showApp();
  } else {
    document.getElementById("loginError").style.display = "block";
  }
}

/* SHOW APP */
function showApp() {
  document.getElementById("loginOverlay").style.display = "none";
  document.getElementById("appContainer").style.display = "block";
  // render(preloadedData);  // call your existing render here
}
</script>

</body>
</html>
