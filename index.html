<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
/* ================= THEME ================= */
:root {
  --mol-blue: #1f4ea3;
  --bg: #f4f6fb;
  --card: #ffffff;
  --danger: #c62828;
}

/* ================= BASE ================= */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #000;
}

/* ================= HEADER ================= */
h1 {
  text-align: center;
  color: var(--mol-blue);
  margin: 16px 0 6px;
  font-size: 24px;
}

.summary {
  text-align: center;
  margin-bottom: 16px;
}

.summary .amount {
  font-size: 20px;
  font-weight: bold;
}

.summary .date {
  font-size: 12px;
  color: #555;
}

/* ================= TABLE WRAPPER ================= */
.table-wrapper {
  overflow-x: auto;
  padding: 0 12px 40px;
  -webkit-overflow-scrolling: touch;
}

/* ================= TABLE ROW ================= */
.row {
  display: grid;
  grid-template-columns:
    200px   /* Name */
    90px    /* Total */
    100px   /* On Account */
    80px    /* 90+ */
    80px    /* 60–90 */
    80px    /* 30–60 */
    120px;  /* Forecast */
  gap: 8px;
  padding: 10px;
  align-items: center;
  min-width: 900px;
  font-size: 14px;
  background: #fff;
}

/* ================= HEADER ROW ================= */
.header {
  background: var(--mol-blue);
  color: #fff;
  font-weight: bold;
  border-radius: 6px;
}

/* ================= CARDS ================= */
.card {
  background: var(--card);
  border-radius: 6px;
  margin-top: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

/* ================= SALES PIC ================= */
.pic-row {
  font-weight: bold;
  cursor: pointer;
}

/* ================= CUSTOMER ================= */
.customer {
  background: #eef3ff;
}

/* ================= INVOICE ================= */
.invoice {
  padding-left: 28px;
  font-size: 13px;
  background: #fafbff;
}

/* ================= 90+ HIGHLIGHT ================= */
.red {
  color: var(--danger);
  font-weight: bold;
}

/* ================= INPUT ================= */
input {
  width: 100%;
  padding: 6px;
  font-size: 14px;
  box-sizing: border-box;
}

/* ================= HIDDEN ================= */
.hidden {
  display: none;
}

/* ================= TOAST ================= */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--mol-blue);
  color: #fff;
  padding: 10px 18px;
  border-radius: 20px;
  display: none;
  font-size: 14px;
}

/* =================================================
   MOBILE TABLE (NOT CARDS)
   ================================================= */
@media (max-width: 768px) {

  h1 {
    font-size: 20px;
  }

  .summary .amount {
    font-size: 18px;
  }

  .row {
    min-width: 640px;
    font-size: 15px;
    padding: 8px 6px;
    gap: 6px;
  }

  .header {
    font-size: 14px;
  }

  .customer,
  .invoice {
    background: #fff;
  }

  .invoice {
    font-size: 14px;
    padding-left: 16px;
  }

  input {
    font-size: 15px;
    padding: 5px;
  }
}
</style>
</head>

<body>

<h1>Outstanding Receivables</h1>

<div class="summary">
  <div class="amount" id="netOutstanding">—</div>
  <div class="date" id="lastUpdated">Last refreshed: —</div>
</div>

<div class="table-wrapper">
  <div class="row header">
    <div>Name</div>
    <div>Total</div>
    <div>On Account</div>
    <div>90+</div>
    <div>60–90</div>
    <div>30–60</div>
    <div>Forecast</div>
  </div>

  <div id="app"></div>
</div>

<div class="toast" id="toast">Forecast updated</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

let openPIC = null;
let openCustomer = null;

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    render(data);
    updateSummary(data);
  });

function updateSummary(data) {
  let totalOutstanding = 0;
  let totalOnAccount = 0;

  data.forEach(p => {
    totalOutstanding += sum(p.totals);
    Object.values(p.customers).forEach(c => {
      totalOnAccount += c.onAccount || 0;
    });
  });

  document.getElementById("netOutstanding").innerText =
    "Net Outstanding: ₹" + (totalOutstanding - totalOnAccount).toLocaleString();

  document.getElementById("lastUpdated").innerText =
    "Last refreshed: " + new Date().toLocaleString();
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.forEach(pic => {
    const card = document.createElement("div");
    card.className = "card";

    const picRow = document.createElement("div");
    picRow.className = "row pic-row";
    picRow.innerHTML = `
      <div>${pic.salesPIC}</div>
      <div>${sum(pic.totals)}</div>
      <div></div>
      <div class="red">${pic.totals["90+"]}</div>
      <div>${pic.totals["61-90"]}</div>
      <div>${pic.totals["31-60"]}</div>
      <div></div>
    `;

    const customerContainer = document.createElement("div");
    customerContainer.className = "hidden";

    picRow.onclick = () => toggle(customerContainer, "pic");

    Object.values(pic.customers).forEach(c => {
      const customerRow = document.createElement("div");
      customerRow.className = "row customer";
      customerRow.innerHTML = `
        <div>${c.customerName}</div>
        <div>${sum(c.totals)}</div>
        <div>${c.onAccount || 0}</div>
        <div class="red">${c.totals["90+"]}</div>
        <div>${c.totals["61-90"]}</div>
        <div>${c.totals["31-60"]}</div>
        <div>
          <input type="number"
            value="${c.forecast || ""}"
            onclick="event.stopPropagation()"
            onchange="saveForecast('${pic.salesPIC}','${c.customerName}',this.value)">
        </div>
      `;

      const invoiceContainer = document.createElement("div");
      invoiceContainer.className = "hidden";

      customerRow.onclick = () => toggle(invoiceContainer, "customer");

      c.invoices.forEach(i => {
        const inv = document.createElement("div");
        inv.className = "row invoice";
        inv.innerHTML = `
          <div>${i.invoiceNo}</div>
          <div>${i.total}</div>
          <div></div>
          <div class="red">${i.ageing["90+"]}</div>
          <div>${i.ageing["61-90"]}</div>
          <div>${i.ageing["31-60"]}</div>
          <div></div>
        `;
        invoiceContainer.appendChild(inv);
      });

      customerContainer.appendChild(customerRow);
      customerContainer.appendChild(invoiceContainer);
    });

    card.appendChild(picRow);
    card.appendChild(customerContainer);
    app.appendChild(card);
  });
}

function sum(t) {
  return (t["90+"] || 0) + (t["61-90"] || 0) + (t["31-60"] || 0) + (t["1-30"] || 0);
}

function toggle(el, level) {
  if (level === "pic" && openPIC && openPIC !== el) openPIC.classList.add("hidden");
  if (level === "customer" && openCustomer && openCustomer !== el) openCustomer.classList.add("hidden");

  el.classList.toggle("hidden");

  if (level === "pic") openPIC = el.classList.contains("hidden") ? null : el;
  if (level === "customer") openCustomer = el.classList.contains("hidden") ? null : el;
}

function saveForecast(pic, customer, value) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateForecast",
      salesPIC: pic,
      customer: customer,
      forecast: Number(value)
    })
  }).then(showToast);
}

function showToast() {
  const t = document.getElementById("toast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}
</script>

</body>
</html>
