<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
:root {
  --comp-blue: #002147;
  --comp-blue-pale: #f0f4f8;
  --border-color: #d1d9e6;
  --text-dark: #1a1a1a;
  --text-muted: #4a5568;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background-color: #ffffff;
  color: var(--text-dark);
}

/* Header & Summary - iPhone Optimized */
.header-container {
  background: var(--comp-blue);
  color: #ffffff;
  padding: 12px 12px;
}

h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.summary {
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.summary .amount {
  font-size: 34px; /* Very large for clarity */
  font-weight: 800;
  line-height: 1.1;
}

.summary .date {
  font-size: 11px;
  opacity: 0.8;
  margin-top: 2px;
}

/* Table Management */
.table-wrapper {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.table-content {
  min-width: 950px; /* Room for large text without squashing */
  padding-bottom: 100px;
}

.row {
  display: grid;
  /* Columns: Name, Total, On A/C, 90+, 60-90, 30-60, Forecast */
  grid-template-columns: 2.4fr 1.1fr 1fr 0.8fr 0.8fr 0.8fr 1.1fr;
  border-bottom: 1px solid var(--border-color);
  align-items: center;
  font-size: 18px; /* Large Text */
}

.header {
  background: #f2f2f2;
  border-bottom: 2px solid var(--comp-blue);
  color: var(--comp-blue);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 12px; 
  position: sticky;
  top: 0;
  z-index: 10;
}

.row > div {
  padding: 4px 6px; /* Tight padding to reduce gaps */
  white-space: nowrap;
}

/* Row Hierarchies */
.pic-row {
  background: var(--comp-blue-pale);
  font-weight: 800;
  cursor: pointer;
}

.customer-row {
  background: #ffffff;
  font-weight: 500;
  cursor: pointer;
}

.invoice-row {
  font-size: 16px;
  color: var(--text-muted);
  background: #fafafa;
}

.num { 
  text-align: right; 
  font-family: 'SF Mono', monospace;
}

/* Forecast Input Containment */
input {
  width: 95%;
  padding: 2px 4px;
  border: 1px solid var(--border-color);
  border-radius: 2px;
  font-size: 16px;
  text-align: right;
  height: 26px;
  box-sizing: border-box;
}

.hidden { display: none; }

.mobile-hint {
  padding: 5px;
  font-size: 10px;
  background: #eee;
  text-align: center;
  color: #666;
  font-weight: bold;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 8px 16px;
  border-radius: 4px;
  font-size: 14px;
  display: none;
  z-index: 1000;
}
</style>
</head>

<body>

<div class="header-container">
  <h1>Outstanding Receivables</h1>
  <div class="summary">
    <div class="amount" id="netOutstanding">₹0.00</div>
    <div class="date" id="lastUpdated">SYNCING...</div>
  </div>
</div>

<div class="mobile-hint">SWIPE LEFT TO VIEW FULL COLUMNS</div>

<div class="table-wrapper">
  <div class="table-content">
    <div class="row header">
      <div>Account / Invoice</div>
      <div class="num">Total</div>
      <div class="num">On A/C</div>
      <div class="num">90+</div>
      <div class="num">60–90</div>
      <div class="num">30–60</div>
      <div class="num">Forecast</div>
    </div>
    <div id="app"></div>
  </div>
</div>

<div class="toast" id="toast">Data Saved</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

let openPIC = null;
let openCustomer = null;

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    render(data);
    updateSummary(data);
  });

function updateSummary(data) {
  let totalOutstanding = 0;
  let totalOnAccount = 0;

  data.forEach(p => {
    totalOutstanding += sum(p.totals);
    Object.values(p.customers).forEach(c => {
      totalOnAccount += c.onAccount || 0;
    });
  });

  document.getElementById("netOutstanding").innerText =
    "₹" + (totalOutstanding - totalOnAccount).toLocaleString('en-IN', {minimumFractionDigits: 2});

  document.getElementById("lastUpdated").innerText =
    "LAST REFRESHED: " + new Date().toLocaleString().toUpperCase();
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.forEach(pic => {
    const picRow = createPICRow(pic);
    const customerContainer = document.createElement("div");
    customerContainer.className = "hidden";

    picRow.onclick = () => toggle(customerContainer, "pic");

    Object.values(pic.customers).forEach(c => {
      const customerRow = createCustomerRow(pic.salesPIC, c);
      const invoiceContainer = document.createElement("div");
      invoiceContainer.className = "hidden";

      customerRow.onclick = () => toggle(invoiceContainer, "customer");

      c.invoices.forEach(i => {
        const inv = document.createElement("div");
        inv.className = "row invoice-row";
        inv.innerHTML = `
          <div style="padding-left: 25px;">${i.invoiceNo}</div>
          <div class="num">${i.total.toLocaleString('en-IN')}</div>
          <div class="num"></div>
          <div class="num">${i.ageing["90+"] || 0}</div>
          <div class="num">${i.ageing["61-90"] || 0}</div>
          <div class="num">${i.ageing["31-60"] || 0}</div>
          <div class="num"></div>
        `;
        invoiceContainer.appendChild(inv);
      });

      customerContainer.appendChild(customerRow);
      customerContainer.appendChild(invoiceContainer);
    });

    app.appendChild(picRow);
    app.appendChild(customerContainer);
  });
}

function createPICRow(pic) {
  const row = document.createElement("div");
  row.className = "row pic-row";
  row.innerHTML = `
    <div>${pic.salesPIC}</div>
    <div class="num">${sum(pic.totals).toLocaleString('en-IN')}</div>
    <div class="num"></div>
    <div class="num">${pic.totals["90+"] || 0}</div>
    <div class="num">${pic.totals["61-90"] || 0}</div>
    <div class="num">${pic.totals["31-60"] || 0}</div>
    <div class="num"></div>
  `;
  return row;
}

function createCustomerRow(picName, c) {
  const row = document.createElement("div");
  row.className = "row customer-row";
  row.innerHTML = `
    <div style="padding-left: 12px;">${c.customerName}</div>
    <div class="num">${sum(c.totals).toLocaleString('en-IN')}</div>
    <div class="num">${(c.onAccount || 0).toLocaleString('en-IN')}</div>
    <div class="num">${c.totals["90+"] || 0}</div>
    <div class="num">${c.totals["61-90"] || 0}</div>
    <div class="num">${c.totals["31-60"] || 0}</div>
    <div class="num">
      <input type="number" value="${c.forecast || ""}" 
        onclick="event.stopPropagation()"
        onchange="saveForecast('${picName}','${c.customerName}',this.value)">
    </div>
  `;
  return row;
}

function sum(t) {
  return (t["90+"] || 0) + (t["61-90"] || 0) + (t["31-60"] || 0) + (t["1-30"] || 0);
}

function toggle(el, level) {
  if (level === "pic" && openPIC && openPIC !== el) openPIC.classList.add("hidden");
  if (level === "customer" && openCustomer && openCustomer !== el) openCustomer.classList.add("hidden");
  el.classList.toggle("hidden");
  if (level === "pic") openPIC = el.classList.contains("hidden") ? null : el;
  if (level === "customer") openCustomer = el.classList.contains("hidden") ? null : el;
}

function saveForecast(pic, customer, value) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "updateForecast", salesPIC: pic, customer: customer, forecast: Number(value) })
  }).then(showToast);
}

function showToast() {
  const t = document.getElementById("toast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}
</script>

</body>
</html>
