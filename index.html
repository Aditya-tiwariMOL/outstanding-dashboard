<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
/* ================= THEME ================= */
:root {
  --mol-blue: #1f4ea3;
  --bg: #f5f7fb;
  --border: #e3e6ef;
  --red: #c62828;
  --green: #2e7d32;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: #111;
}

/* ================= HEADER ================= */
h1 {
  text-align: center;
  color: var(--mol-blue);
  margin: 14px 0 4px;
  font-size: 22px;
  font-weight: 600;
}

.summary {
  text-align: center;
  margin-bottom: 14px;
}

.summary .amount {
  font-size: 20px;
  font-weight: 700;
}

.summary .date {
  font-size: 12px;
  color: #555;
}

/* ================= TABLE ================= */
.table-wrapper {
  overflow-x: auto;
  padding: 0 8px 40px;
  -webkit-overflow-scrolling: touch;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 720px; /* desktop full */
  background: #fff;
}

thead th {
  background: var(--mol-blue);
  color: #fff;
  padding: 8px 6px;
  font-size: 13px;
  text-align: left;
  white-space: nowrap;
}

tbody td {
  padding: 7px 6px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  white-space: nowrap;
}

/* ================= ROW TYPES ================= */
.pic-row td {
  font-weight: 700;
  background: #fff;
}

.customer-row td {
  background: #f3f6ff;
}

.invoice-row td {
  background: #fafbff;
  font-size: 13px;
}

/* ================= COLORS ================= */
.red {
  color: var(--red);
  font-weight: 600;
}

.green {
  color: var(--green);
  font-weight: 600;
}

/* ================= INPUT ================= */
input {
  width: 70px;
  padding: 4px;
  font-size: 13px;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {

  h1 {
    font-size: 20px;
  }

  .summary .amount {
    font-size: 18px;
  }

  thead th {
    font-size: 14px;
    padding: 10px 6px;
  }

  tbody td {
    font-size: 15px;
    padding: 10px 6px;
  }

  table {
    min-width: 640px; /* mobile compact */
  }

  input {
    font-size: 14px;
    width: 80px;
  }
}

/* ================= TOAST ================= */
.toast {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--mol-blue);
  color: #fff;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 13px;
  display: none;
}
</style>
</head>

<body>

<h1>Outstanding Receivables</h1>

<div class="summary">
  <div class="amount" id="netOutstanding">—</div>
  <div class="date" id="lastUpdated">—</div>
</div>

<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>Sales PIC</th>
        <th>Total</th>
        <th>On Account</th>
        <th>90+</th>
        <th>60–90</th>
        <th>30–60</th>
        <th>Forecast</th>
      </tr>
    </thead>
    <tbody id="app"></tbody>
  </table>
</div>

<div class="toast" id="toast">Forecast updated</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

let openPIC = null;
let openCustomer = null;

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    render(data);
    updateSummary(data);
  });

function updateSummary(data) {
  let totalOutstanding = 0;
  let totalOnAccount = 0;

  data.forEach(p => {
    totalOutstanding += sum(p.totals);
    Object.values(p.customers).forEach(c => {
      totalOnAccount += c.onAccount || 0;
    });
  });

  document.getElementById("netOutstanding").innerText =
    "Net Outstanding: ₹" + (totalOutstanding - totalOnAccount).toLocaleString();

  document.getElementById("lastUpdated").innerText =
    "Last updated: " + new Date().toLocaleString();
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.forEach(pic => {
    const picRow = document.createElement("tr");
    picRow.className = "pic-row";
    picRow.innerHTML = `
      <td>${pic.salesPIC}</td>
      <td>₹${sum(pic.totals)}</td>
      <td></td>
      <td class="red">${pic.totals["90+"]}</td>
      <td>${pic.totals["61-90"]}</td>
      <td>${pic.totals["31-60"]}</td>
      <td></td>
    `;
    app.appendChild(picRow);

    Object.values(pic.customers).forEach(c => {
      const custRow = document.createElement("tr");
      custRow.className = "customer-row";
      custRow.innerHTML = `
        <td>${c.customerName}</td>
        <td>₹${sum(c.totals)}</td>
        <td class="green">${c.onAccount || 0}</td>
        <td class="red">${c.totals["90+"]}</td>
        <td>${c.totals["61-90"]}</td>
        <td>${c.totals["31-60"]}</td>
        <td>
          <input type="number"
            value="${c.forecast || ""}"
            onchange="saveForecast('${pic.salesPIC}','${c.customerName}',this.value)">
        </td>
      `;
      app.appendChild(custRow);
    });
  });
}

function sum(t) {
  return (t["90+"] || 0) + (t["61-90"] || 0) + (t["31-60"] || 0) + (t["1-30"] || 0);
}

function saveForecast(pic, customer, value) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateForecast",
      salesPIC: pic,
      customer: customer,
      forecast: Number(value)
    })
  }).then(showToast);
}

function showToast() {
  const t = document.getElementById("toast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}
</script>

</body>
</html>
