<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
:root {
  --mol-blue: #1f4ea3;
  --bg: #f5f7fb;
  --card: #ffffff;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #000;
}

h1 {
  text-align: center;
  color: var(--mol-blue);
  margin: 20px 0 10px;
}

.summary {
  text-align: center;
  margin-bottom: 20px;
}

.summary .amount {
  font-size: 22px;
  font-weight: bold;
}

.summary .date {
  font-size: 12px;
  color: #555;
}

.table-wrapper {
  overflow-x: auto;
  padding: 0 10px 30px;
}

.row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
  gap: 8px;
  padding: 10px;
  align-items: center;
  min-width: 800px;
}

.header {
  background: var(--mol-blue);
  color: #fff;
  font-weight: bold;
  border-radius: 6px;
}

.card {
  background: var(--card);
  border-radius: 6px;
  margin-top: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.customer {
  background: #f0f4ff;
}

.invoice {
  padding-left: 30px;
  font-size: 14px;
}

.hidden {
  display: none;
}

input {
  width: 100%;
  padding: 6px;
  box-sizing: border-box;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--mol-blue);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  display: none;
}
</style>
</head>

<body>

<h1>Outstanding Receivables</h1>

<div class="summary">
  <div class="amount" id="netOutstanding">—</div>
  <div class="date" id="lastUpdated">Last updated: —</div>
</div>

<div class="table-wrapper">
  <div class="row header">
    <div>Name</div>
    <div>Total</div>
    <div>90+</div>
    <div>60–90</div>
    <div>30–60</div>
    <div>On Account</div>
  </div>

  <div id="app"></div>
</div>

<div class="toast" id="toast">Forecast updated</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

let openPIC = null;
let openCustomer = null;

fetch(API_URL)
  .then(r => r.json())
  .then(data => {
    render(data);
    updateSummary(data);
  });

function updateSummary(data) {
  let total = 0;
  let onAccount = 0;

  data.forEach(p => {
    total += sum(p.totals);
    Object.values(p.customers).forEach(c => {
      onAccount += c.forecast || 0;
    });
  });

  document.getElementById("netOutstanding").innerText =
    "Net Outstanding: ₹" + (total - onAccount).toLocaleString();

  document.getElementById("lastUpdated").innerText =
    "Last updated: " + new Date().toLocaleString();
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.forEach(pic => {
    const card = document.createElement("div");
    card.className = "card";

    const picRow = rowHTML(pic.salesPIC, pic.totals);
    const customerContainer = document.createElement("div");
    customerContainer.className = "hidden";

    picRow.onclick = () => toggle(customerContainer, "pic");

    Object.values(pic.customers).forEach(c => {
      const customerRow = document.createElement("div");
      customerRow.className = "row customer";
      customerRow.innerHTML = `
        <div>${c.customerName}</div>
        <div>${sum(c.totals)}</div>
        <div>${c.totals["90+"]}</div>
        <div>${c.totals["61-90"]}</div>
        <div>${c.totals["31-60"]}</div>
        <div>
          <input type="number" value="${c.forecast || 0}"
            onclick="event.stopPropagation()"
            onchange="saveForecast('${pic.salesPIC}','${c.customerName}',this.value)">
        </div>
      `;

      const invContainer = document.createElement("div");
      invContainer.className = "hidden";

      customerRow.onclick = () => toggle(invContainer, "customer");

      c.invoices.forEach(i => {
        const inv = document.createElement("div");
        inv.className = "row invoice";
        inv.innerHTML = `
          <div>${i.invoiceNo}</div>
          <div>${i.total}</div>
          <div>${i.ageing["90+"]}</div>
          <div>${i.ageing["61-90"]}</div>
          <div>${i.ageing["31-60"]}</div>
          <div></div>
        `;
        invContainer.appendChild(inv);
      });

      customerContainer.appendChild(customerRow);
      customerContainer.appendChild(invContainer);
    });

    card.appendChild(picRow);
    card.appendChild(customerContainer);
    app.appendChild(card);
  });
}

function rowHTML(name, totals) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `
    <div>${name}</div>
    <div>${sum(totals)}</div>
    <div>${totals["90+"]}</div>
    <div>${totals["61-90"]}</div>
    <div>${totals["31-60"]}</div>
    <div></div>
  `;
  return row;
}

function sum(t) {
  return (t["90+"] || 0) + (t["61-90"] || 0) + (t["31-60"] || 0) + (t["1-30"] || 0);
}

function toggle(el, level) {
  if (level === "pic" && openPIC && openPIC !== el) openPIC.classList.add("hidden");
  if (level === "customer" && openCustomer && openCustomer !== el) openCustomer.classList.add("hidden");

  el.classList.toggle("hidden");
  if (level === "pic") openPIC = el.classList.contains("hidden") ? null : el;
  if (level === "customer") openCustomer = el.classList.contains("hidden") ? null : el;
}

function saveForecast(pic, customer, value) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateForecast",
      salesPIC: pic,
      customer: customer,
      forecast: Number(value)
    })
  }).then(() => showToast());
}

function showToast() {
  const t = document.getElementById("toast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}
</script>

</body>
</html>
