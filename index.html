<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOL Outstanding Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>

/* ================= ROOT THEME ================= */

:root {
  --mol-blue:#1f4ea3;
  --mol-light:#eef3ff;
  --bg:#f5f7fb;
  --card:#ffffff;

  --success:#1a7f37;
  --danger:#dc2626;
  --grid:rgba(0,0,0,.06);
}

/* ================= GLOBAL ================= */

body {
  margin:0;
  font-family: "Segoe UI", system-ui, Arial, sans-serif;
  background:var(--bg);
  color:#2c2c2c;
}

h1,h2,h3 { margin:0; }

/* ================= LOGIN ================= */

.login-overlay{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.login-box{
  background:#fff;
  padding:30px;
  border-radius:12px;
  width:100%;
  max-width:360px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.login-box img{
  max-width:150px;
  margin-bottom:15px;
}

.login-box h2{
  font-size:16px;
  color:var(--mol-blue);
  margin-bottom:20px;
}

.login-box input,
.login-box button{
  width:100%;
  padding:11px;
  margin-bottom:12px;
  font-size:15px;
}

.login-box button{
  background:var(--mol-blue);
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.login-error{
  font-size:12px;
  color:#b91c1c;
  display:none;
}


/* ================= HEADER ================= */

.header-wrap{
  text-align:center;
  margin:25px 0 20px;
}

.header-wrap h1{
  font-size:26px;
  color:var(--mol-blue);
  font-weight:600;
  margin-bottom:6px;
}

.summary{
  font-size:14px;
}

.summary .amount{
  font-weight:600;
  font-size:18px;
}

.summary .date{
  color:#777;
}


/* ================= TABLE ================= */

.table-wrapper{
  padding:0 15px 30px;
  overflow-x:auto;
}

.row{
  display:grid;
  grid-template-columns:
    2fr 1fr 1fr 0.8fr 0.8fr 0.8fr 0.8fr 1fr;

  gap:6px;
  padding:10px 8px;
  min-width:900px;
  background:#fff;
  border-bottom:1px solid var(--grid);
  font-size:15px;
}

.row > div{
  padding-right:6px;
  border-right:1px solid var(--grid);
}

.row > div:last-child{
  border-right:none;
}

.header{
  background:var(--mol-blue);
  color:#fff;
  font-weight:600;
  border-radius:8px;
  font-size:14px;
}

.card{
  background:#fff;
  border-radius:8px;
  margin-top:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.customer{
  background:var(--mol-light);
}

.invoice{
  padding-left:18px;
  background:#ecfdf5;
  border-left:3px solid rgba(26,127,55,.3);
  font-size:14px;
}

.hidden{ display:none; }

.on-account{
  color:var(--success);
  font-weight:600;
}

.overdue{
  color:var(--danger);
  font-weight:600;
}


/* ================= DASHBOARD ================= */

#dashboard{
  padding:25px 15px 60px;
  max-width:1200px;
  margin:auto;
}

#dashboard h2{
  text-align:center;
  color:var(--mol-blue);
  font-weight:600;
  margin-bottom:25px;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  margin-bottom:25px;
}

.chart-box{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  border:1px solid rgba(0,0,0,.04);

  height:420px;
  display:flex;
  flex-direction:column;
}

.chart-box.tall{
  height:520px;
}

canvas{
  width:100%!important;
  height:100%!important;
}


/* ================= DRAWER ================= */

.drawer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:10000;
}

.drawer.hidden{ display:none; }

.drawer-content{
  position:absolute;
  bottom:0;
  left:0;
  right:0;

  background:#fff;
  padding:18px;
  border-radius:16px 16px 0 0;
}

.drawer-actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.drawer-actions button{
  flex:1;
  padding:10px;
  font-size:15px;
}

.drawer-actions .primary{
  background:var(--mol-blue);
  color:#fff;
  border:none;
  border-radius:6px;
}


/* ================= TOAST ================= */

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--mol-blue);
  color:#fff;
  padding:10px 20px;
  border-radius:25px;
  display:none;
}


/* ================= MOBILE ================= */

@media(max-width:768px){

  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .chart-box,
  .chart-box.tall{
    height:420px;
  }

  .row{
    font-size:14px;
    min-width:700px;
  }

}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">

    <img src="https://raw.githubusercontent.com/Aditya-tiwariMOL/outstanding-dashboard/main/MOL%20Logo%2001.png">

    <h2>MOL LOGISTICS (INDIA) PVT LTD</h2>

    <input type="password" id="pwd" placeholder="Enter access code">

    <button onclick="checkPassword()">Login</button>

    <div class="login-error" id="loginError">
      Invalid access code
    </div>

  </div>
</div>


<!-- MAIN APP -->

<div id="appContainer" style="display:none;">


<!-- HEADER -->

<div class="header-wrap">

  <h1>Outstanding Receivables</h1>

  <div class="summary">

    <div class="amount" id="netOutstanding">—</div>
    <div class="date" id="lastUpdated">—</div>

  </div>

</div>


<!-- TABLE -->

<div class="table-wrapper">

  <div class="row header">

    <div>Name</div>
    <div>Total</div>
    <div>On Acc</div>
    <div>90+</div>
    <div>60+</div>
    <div>30+</div>
    <div>1+</div>
    <div>Fcst</div>

  </div>

  <div id="app"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

  <h2>Dashboard Summary</h2>

  <div class="dashboard-grid">

    <div class="chart-box">
      <canvas id="ageingChart"></canvas>
    </div>

    <div class="chart-box tall">
      <canvas id="picChart"></canvas>
    </div>

  </div>


  <div class="chart-box tall">
    <canvas id="defaulterChart"></canvas>
  </div>

</div>

</div>


<!-- FORECAST DRAWER -->

<div id="forecastDrawer" class="drawer hidden">

  <div class="drawer-content">

    <div id="drawerCustomer" style="font-weight:600"></div>

    <div id="drawerTotal"
         style="font-size:13px;color:#666;margin-bottom:10px"></div>

    <input type="number"
           id="drawerInput"
           placeholder="Enter forecast"
           style="width:100%;padding:10px">

    <div class="drawer-actions">

      <button onclick="closeDrawer()">Cancel</button>

      <button class="primary"
              onclick="saveDrawerForecast()">Save</button>

    </div>

  </div>

</div>


<div class="toast" id="toast">Forecast Updated</div>


<!-- YOUR ORIGINAL SCRIPT (UNCHANGED) -->

<script>
/* KEEP YOUR ORIGINAL JS HERE */
/* No logic changes needed */
</script>

</body>
</html>
