<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
:root {
  --comp-blue: #002147;
  --comp-blue-pale: #f0f4f8;
  --border-color: #cbd5e1;
  --text-dark: #0f172a;
}

body {
  margin: 0;
  font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #ffffff;
  color: var(--text-dark);
  -webkit-font-smoothing: antialiased;
}

/* Header Section */
.header-container {
  background: var(--comp-blue);
  color: #ffffff;
  padding: 10px 12px;
  border-bottom: 3px solid #003366;
}

h1 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.9;
}

.summary {
  margin-top: 2px;
}

.summary .amount {
  font-size: 36px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1px;
}

.summary .date {
  font-size: 10px;
  font-weight: 600;
  margin-top: 4px;
  text-transform: uppercase;
  color: #94a3b8;
}

/* Table Management */
.table-wrapper {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
}

.table-content {
  /* min-width ensures columns don't collapse, but we keep it tight */
  min-width: 800px; 
}

.row {
  display: grid;
  /* NAME takes only what it needs, TOTALS follow immediately */
  grid-template-columns: minmax(220px, 1.5fr) 100px 90px 80px 80px 80px 110px;
  border-bottom: 1px solid var(--border-color);
  align-items: center;
}

.header {
  background: #f8fafc;
  color: var(--comp-blue);
  font-weight: 800;
  font-size: 11px;
  text-transform: uppercase;
  position: sticky;
  top: 0;
  z-index: 10;
}

.row > div {
  padding: 6px 8px; /* Extremely tight vertical space */
  white-space: nowrap;
  font-size: 19px; /* Large easy-to-read text */
}

/* Content Styles */
.pic-row {
  background: var(--comp-blue-pale);
  font-weight: 800;
  color: var(--comp-blue);
  cursor: pointer;
}

.customer-row {
  background: #ffffff;
  font-weight: 600;
  cursor: pointer;
}

.invoice-row {
  font-size: 17px !important;
  color: #475569;
  background: #fafafa;
}

.num { 
  text-align: right; 
  font-family: 'Roboto Mono', monospace; /* Monospaced for aligning digits */
  font-weight: 700;
  letter-spacing: -0.5px;
}

/* Input Box - Contained */
input {
  width: 100%;
  padding: 4px;
  border: 1px solid #94a3b8;
  border-radius: 3px;
  font-size: 16px;
  text-align: right;
  font-weight: 700;
  color: var(--comp-blue);
  background: #fff;
}

.hidden { display: none; }

.mobile-hint {
  padding: 4px;
  font-size: 11px;
  background: #f1f5f9;
  text-align: center;
  color: var(--comp-blue);
  font-weight: 700;
  border-bottom: 1px solid var(--border-color);
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: white;
  padding: 10px 20px;
  border-radius: 6px;
  font-weight: 600;
  display: none;
  z-index: 9999;
}
</style>
</head>

<body>

<div class="header-container">
  <h1>Outstanding Receivables</h1>
  <div class="summary">
    <div class="amount" id="netOutstanding">₹0.00</div>
    <div class="date" id="lastUpdated">FETCHING...</div>
  </div>
</div>

<div class="mobile-hint">SWIPE LEFT FOR AGEING & FORECAST</div>

<div class="table-wrapper">
  <div class="table-content">
    <div class="row header">
      <div>Account Name</div>
      <div class="num">Total</div>
      <div class="num">On A/C</div>
      <div class="num">90+</div>
      <div class="num">60–90</div>
      <div class="num">30–60</div>
      <div class="num">Forecast</div>
    </div>
    <div id="app"></div>
  </div>
</div>

<div class="toast" id="toast">Update Saved</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

let openPIC = null;
let openCustomer = null;

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    render(data);
    updateSummary(data);
  });

function updateSummary(data) {
  let totalOutstanding = 0;
  let totalOnAccount = 0;

  data.forEach(p => {
    totalOutstanding += sum(p.totals);
    Object.values(p.customers).forEach(c => {
      totalOnAccount += c.onAccount || 0;
    });
  });

  document.getElementById("netOutstanding").innerText =
    "₹" + (totalOutstanding - totalOnAccount).toLocaleString('en-IN', {minimumFractionDigits: 2});

  document.getElementById("lastUpdated").innerText =
    "AS OF: " + new Date().toLocaleString().toUpperCase();
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.forEach(pic => {
    const picRow = createPICRow(pic);
    const customerContainer = document.createElement("div");
    customerContainer.className = "hidden";

    picRow.onclick = () => toggle(customerContainer, "pic");

    Object.values(pic.customers).forEach(c => {
      const customerRow = createCustomerRow(pic.salesPIC, c);
      const invoiceContainer = document.createElement("div");
      invoiceContainer.className = "hidden";

      customerRow.onclick = () => toggle(invoiceContainer, "customer");

      c.invoices.forEach(i => {
        const inv = document.createElement("div");
        inv.className = "row invoice-row";
        inv.innerHTML = `
          <div style="padding-left: 20px; font-size:15px;">INV: ${i.invoiceNo}</div>
          <div class="num">${i.total.toLocaleString('en-IN')}</div>
          <div class="num"></div>
          <div class="num">${i.ageing["90+"] || 0}</div>
          <div class="num">${i.ageing["61-90"] || 0}</div>
          <div class="num">${i.ageing["31-60"] || 0}</div>
          <div class="num"></div>
        `;
        invoiceContainer.appendChild(inv);
      });

      customerContainer.appendChild(customerRow);
      customerContainer.appendChild(invoiceContainer);
    });

    app.appendChild(picRow);
    app.appendChild(customerContainer);
  });
}

function createPICRow(pic) {
  const row = document.createElement("div");
  row.className = "row pic-row";
  row.innerHTML = `
    <div>${pic.salesPIC}</div>
    <div class="num">${sum(pic.totals).toLocaleString('en-IN')}</div>
    <div class="num"></div>
    <div class="num">${pic.totals["90+"] || 0}</div>
    <div class="num">${pic.totals["61-90"] || 0}</div>
    <div class="num">${pic.totals["31-60"] || 0}</div>
    <div class="num"></div>
  `;
  return row;
}

function createCustomerRow(picName, c) {
  const row = document.createElement("div");
  row.className = "row customer-row";
  row.innerHTML = `
    <div style="padding-left: 8px;">${c.customerName}</div>
    <div class="num">${sum(c.totals).toLocaleString('en-IN')}</div>
    <div class="num">${(c.onAccount || 0).toLocaleString('en-IN')}</div>
    <div class="num">${c.totals["90+"] || 0}</div>
    <div class="num">${c.totals["61-90"] || 0}</div>
    <div class="num">${c.totals["31-60"] || 0}</div>
    <div class="num">
      <input type="number" value="${c.forecast || ""}" 
        onclick="event.stopPropagation()"
        onchange="saveForecast('${picName}','${c.customerName}',this.value)">
    </div>
  `;
  return row;
}

function sum(t) {
  return (t["90+"] || 0) + (t["61-90"] || 0) + (t["31-60"] || 0) + (t["1-30"] || 0);
}

function toggle(el, level) {
  if (level === "pic" && openPIC && openPIC !== el) openPIC.classList.add("hidden");
  if (level === "customer" && openCustomer && openCustomer !== el) openCustomer.classList.add("hidden");
  el.classList.toggle("hidden");
  if (level === "pic") openPIC = el.classList.contains("hidden") ? null : el;
  if (level === "customer") openCustomer = el.classList.contains("hidden") ? null : el;
}

function saveForecast(pic, customer, value) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "updateForecast", salesPIC: pic, customer: customer, forecast: Number(value) })
  }).then(showToast);
}

function showToast() {
  const t = document.getElementById("toast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}
</script>

</body>
</html>
