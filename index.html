<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outstanding Receivables</title>

<style>
:root {
  --mol-blue:#1f4ea3;
  --bg:#f4f6fb;
  --card:#fff;
  --success:#1a7f37;
  --danger:#c62828;
  --grid:rgba(0,0,0,.06);
}

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
}

/* ================= LOGIN ================= */
.login-overlay {
  position:fixed;
  inset:0;
  background:#f4f6fb;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.login-box {
  background:#fff;
  padding:30px 26px;
  border-radius:10px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.login-box img {
  max-width:150px;
  margin-bottom:14px;
}

.login-box h2 {
  font-size:16px;
  color:var(--mol-blue);
  margin-bottom:18px;
}

.login-box input,
.login-box button {
  width:100%;
  max-width:260px;
  margin:0 auto 14px;
  display:block;
  padding:10px;
  font-size:15px;
}

.login-box button {
  background:var(--mol-blue);
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

.login-error {
  color:#c62828;
  font-size:12px;
  display:none;
}

/* ================= HEADER ================= */
.header-wrap {
  text-align:center;
  margin:14px 0 10px;
}

h1 {
  margin:0;
  font-size:22px;
  color:var(--mol-blue);
}

.summary .amount {
  font-size:18px;
  font-weight:bold;
}

.summary .date {
  font-size:11px;
  color:#666;
}

/* ================= TABLE ================= */
.table-wrapper {
  overflow-x:auto;
  padding:0 12px 20px;
}

.row {
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr;
  gap:8px;
  padding:12px;
  min-width:900px;
  background:#fff;
  border-bottom:1px solid var(--grid);
  font-size:18px;
}

.row > div {
  border-right:1px solid var(--grid);
  padding-right:6px;
}
.row > div:last-child { border-right:none; }

.header {
  background:var(--mol-blue);
  color:#fff;
  font-weight:bold;
  border-radius:6px;
}

.card {
  background:#fff;
  border-radius:6px;
  margin-top:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.customer { background:#eef3ff; }

.invoice {
  padding-left:20px;
  background:#E5FDEB;
  border-left:3px solid rgba(26,127,55,.18);
  font-size:16px;
}

.hidden { display:none; }

.on-account { color:var(--success); font-weight:bold; }
.overdue { color:var(--danger); font-weight:bold; }

input {
  width:100%;
  padding:6px;
  font-size:16px;
}

/* ================= NOTE ================= */
.total-note {
  font-size:11px;
  color:#777;
  text-align:center;
  margin:6px 12px 30px;
}

/* ================= TOAST ================= */
.toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--mol-blue);
  color:#fff;
  padding:10px 18px;
  border-radius:20px;
  display:none;
}

/* ================= MOBILE ================= */
@media (max-width:768px) {
  h1 { font-size:18px; }
  .summary .amount { font-size:16px; }
  .summary .date { font-size:10px; }
  .row {
    font-size:15px;
    padding:12px 6px;
    gap:6px;
    min-width:740px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <img src="https://raw.githubusercontent.com/Aditya-tiwariMOL/outstanding-dashboard/main/MOL%20Logo%2001.png">
    <h2>MOL LOGISTICS (INDIA) PVT LTD</h2>
    <input type="password" id="pwd" placeholder="Enter access code">
    <button onclick="checkPassword()">Submit</button>
    <div class="login-error" id="loginError">Invalid access code</div>
  </div>
</div>

<!-- APP -->
<div id="appContainer" style="display:none;">

  <div class="header-wrap">
    <h1>Outstanding Receivables</h1>
    <div class="summary">
      <div class="amount" id="netOutstanding">—</div>
      <div class="date" id="lastUpdated">—</div>
    </div>
  </div>

  <div class="table-wrapper">
    <div class="row header">
      <div>Name</div>
      <div>Total</div>
      <div>On Account</div>
      <div>90+</div>
      <div>60–90</div>
      <div>30–60</div>
      <div>Forecast</div>
    </div>
    <div id="app"></div>
  </div>

  <div class="total-note">
    * Total outstanding includes 1–30 days bucket (not displayed separately).
  </div>

</div>

<div class="toast" id="toast">Forecast updated</div>

<script>
/* ===== CONFIG ===== */
const API_URL =
"https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

/* SHA-256 hash of MOL2026 */
const PASSWORD_HASH =
"46d29dfc245f5708edf4d74c58551f5d4bcf0284690b478ecf7e8c021cb0c2f5";

const isMobile = window.innerWidth <= 768;
let preloadedData = null;

/* ===== UTIL ===== */
function toNumber(v){
  if(v==null||v==="") return 0;
  return Number(String(v).replace(/,/g,""));
}
function formatNumber(v){
  const n=toNumber(v);
  if(!isMobile) return n.toLocaleString();
  return n>=1000?Math.round(n/1000)+"K":n;
}
function sum(t){
  return toNumber(t["90+"])+toNumber(t["61-90"])+toNumber(t["31-60"])+toNumber(t["1-30"]);
}

/* ===== PRELOAD DATA ===== */
fetch(API_URL).then(r=>r.json()).then(d=>{
  preloadedData=d;
  if(sessionStorage.getItem("auth")==="1") showApp();
});

/* ===== AUTH ===== */
async function sha256(txt){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function checkPassword(){
  const h=await sha256(document.getElementById("pwd").value);
  if(h===PASSWORD_HASH){
    sessionStorage.setItem("auth","1");
    showApp();
  } else {
    document.getElementById("loginError").style.display="block";
  }
}

function showApp(){
  document.getElementById("loginOverlay").style.display="none";
  document.getElementById("appContainer").style.display="block";
  render(preloadedData);
  updateSummary(preloadedData);
}

/* ===== APP ===== */
function updateSummary(data){
  let t=0,o=0;
  data.forEach(p=>{
    t+=sum(p.totals);
    Object.values(p.customers).forEach(c=>o+=toNumber(c.onAccount));
  });
  netOutstanding.innerText="Net Outstanding: ₹"+formatNumber(t-o);
  lastUpdated.innerText="Last refreshed: "+new Date().toLocaleString();
}

function render(data){
  const app=document.getElementById("app");
  app.innerHTML="";
  let openPIC=null;

  data.forEach(pic=>{
    const card=document.createElement("div");
    card.className="card";

    const picRow=document.createElement("div");
    picRow.className="row";
    picRow.innerHTML=`
      <div>${pic.salesPIC}</div>
      <div>${formatNumber(sum(pic.totals))}</div>
      <div></div>
      <div class="overdue">${formatNumber(pic.totals["90+"])}</div>
      <div>${formatNumber(pic.totals["61-90"])}</div>
      <div>${formatNumber(pic.totals["31-60"])}</div>
      <div></div>`;

    const wrap=document.createElement("div");
    wrap.className="hidden";

    picRow.onclick=()=>{
      if(openPIC&&openPIC!==wrap)openPIC.classList.add("hidden");
      wrap.classList.toggle("hidden");
      openPIC=wrap.classList.contains("hidden")?null:wrap;
      wrap.querySelectorAll(".invoice-wrap").forEach(i=>i.classList.add("hidden"));
    };

    Object.values(pic.customers).forEach(c=>{
      const r=document.createElement("div");
      r.className="row customer";
      r.innerHTML=`
        <div>${c.customerName}</div>
        <div>${formatNumber(sum(c.totals))}</div>
        <div class="on-account">${formatNumber(c.onAccount)}</div>
        <div class="overdue">${formatNumber(c.totals["90+"])}</div>
        <div>${formatNumber(c.totals["61-90"])}</div>
        <div>${formatNumber(c.totals["31-60"])}</div>
        <div>
          <input type="text" value="${c.forecast||""}"
          onclick="event.stopPropagation()"
          onchange="saveForecast('${pic.salesPIC}','${c.customerName}',this.value)">
        </div>`;

      const iw=document.createElement("div");
      iw.className="invoice-wrap hidden";

      r.onclick=()=>{
        const o=!iw.classList.contains("hidden");
        wrap.querySelectorAll(".invoice-wrap").forEach(i=>i.classList.add("hidden"));
        if(!o)iw.classList.remove("hidden");
      };

      c.invoices.forEach(i=>{
        const iv=document.createElement("div");
        iv.className="row invoice";
        iv.innerHTML=`
          <div>${i.invoiceNo}</div>
          <div>${formatNumber(i.total)}</div>
          <div></div>
          <div class="overdue">${formatNumber(i.ageing["90+"])}</div>
          <div>${formatNumber(i.ageing["61-90"])}</div>
          <div>${formatNumber(i.ageing["31-60"])}</div>
          <div></div>`;
        iw.appendChild(iv);
      });

      wrap.appendChild(r);
      wrap.appendChild(iw);
    });

    card.appendChild(picRow);
    card.appendChild(wrap);
    app.appendChild(card);
  });
}

function saveForecast(pic,customer,value){
  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"updateForecast",
      salesPIC:pic,
      customer,
      forecast:toNumber(value)
    })
  }).then(()=>{
    toast.style.display="block";
    setTimeout(()=>toast.style.display="none",2000);
  });
}
</script>

</body>
</html>
