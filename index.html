<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Outstanding Receivables</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      border-radius: 6px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr 1fr;
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      align-items: center;
      cursor: pointer;
    }

    .row.header {
      background: #2f3e5c;
      color: #fff;
      font-weight: bold;
      cursor: default;
    }

    .row.customer {
      background: #f9fafc;
    }

    .row.invoice {
      background: #ffffff;
      padding-left: 30px;
      cursor: default;
    }

    .row:hover:not(.header):not(.invoice) {
      background: #eef2ff;
    }

    .hidden {
      display: none;
    }

    input.forecast {
      width: 100%;
      padding: 4px;
    }

    .section {
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<h1>Outstanding Receivables</h1>

<div class="row header">
  <div>Name</div>
  <div>Total</div>
  <div>90+</div>
  <div>61-90</div>
  <div>31-60</div>
  <div>1-30</div>
  <div>Forecast</div>
</div>

<div id="app"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

let openPIC = null;
let openCustomer = null;

fetch(API_URL)
  .then(res => res.json())
  .then(render);

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.forEach(pic => {
    const picCard = document.createElement("div");
    picCard.className = "card";

    const picRow = createRow(
      pic.salesPIC,
      pic.totals,
      false
    );

    const customerContainer = document.createElement("div");
    customerContainer.className = "hidden";

    picRow.onclick = () => togglePIC(customerContainer);

    Object.values(pic.customers).forEach(customer => {
      const customerBlock = document.createElement("div");

      const customerRow = createRow(
        customer.customerName,
        customer.totals,
        true,
        customer.forecast,
        pic.salesPIC
      );

      const invoiceContainer = document.createElement("div");
      invoiceContainer.className = "hidden";

      customerRow.onclick = (e) => {
        e.stopPropagation();
        toggleCustomer(invoiceContainer);
      };

      customer.invoices.forEach(inv => {
        const invRow = document.createElement("div");
        invRow.className = "row invoice";
        invRow.innerHTML = `
          <div>${inv.invoiceNo}</div>
          <div>${inv.total}</div>
          <div>${inv.ageing["90+"]}</div>
          <div>${inv.ageing["61-90"]}</div>
          <div>${inv.ageing["31-60"]}</div>
          <div>${inv.ageing["1-30"]}</div>
          <div></div>
        `;
        invoiceContainer.appendChild(invRow);
      });

      customerBlock.appendChild(customerRow);
      customerBlock.appendChild(invoiceContainer);
      customerContainer.appendChild(customerBlock);
    });

    picCard.appendChild(picRow);
    picCard.appendChild(customerContainer);
    app.appendChild(picCard);
  });
}

function createRow(name, totals, isCustomer, forecast = null, picName = "") {
  const row = document.createElement("div");
  row.className = "row" + (isCustomer ? " customer" : "");

  row.innerHTML = `
    <div>${name}</div>
    <div>${sum(totals)}</div>
    <div>${totals["90+"]}</div>
    <div>${totals["61-90"]}</div>
    <div>${totals["31-60"]}</div>
    <div>${totals["1-30"]}</div>
    <div>
      ${forecast !== null
        ? `<input type="number" value="${forecast}"
           onchange="updateForecast('${picName}','${name}',this.value)">`
        : ""}
    </div>
  `;
  return row;
}

function sum(t) {
  return t["1-30"] + t["31-60"] + t["61-90"] + t["90+"];
}

function togglePIC(container) {
  if (openPIC && openPIC !== container) {
    openPIC.classList.add("hidden");
  }
  container.classList.toggle("hidden");
  openPIC = container.classList.contains("hidden") ? null : container;
  openCustomer = null;
}

function toggleCustomer(container) {
  if (openCustomer && openCustomer !== container) {
    openCustomer.classList.add("hidden");
  }
  container.classList.toggle("hidden");
  openCustomer = container.classList.contains("hidden") ? null : container;
}

function updateForecast(pic, customer, value) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateForecast",
      salesPIC: pic,
      customer: customer,
      forecast: Number(value)
    })
  });
}
</script>

</body>
</html>
