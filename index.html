<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
:root {
  --mol-blue: #1f4ea3;
  --bg: #f4f6fb;
  --text: #111;
  --red: #c62828;
  --green: #2e7d32;
}

/* ================= BASE ================= */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

h1 {
  text-align: center;
  color: var(--mol-blue);
  margin: 14px 0 6px;
}

.summary {
  text-align: center;
  margin-bottom: 12px;
}

.summary .amount {
  font-size: 20px;
  font-weight: bold;
}

.summary .date {
  font-size: 12px;
  color: #555;
}

/* ================= TABLE ================= */
.table-wrapper {
  overflow-x: auto;
  padding: 0 8px 40px;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 760px;
  background: #fff;
}

thead th {
  background: var(--mol-blue);
  color: #fff;
  font-weight: bold;
  padding: 10px 8px;
  text-align: left;
  font-size: 14px;
  white-space: nowrap;
}

tbody td {
  padding: 8px 8px;
  font-size: 14px;
  border-bottom: 1px solid #e0e0e0;
  white-space: nowrap;
}

/* ================= ROW TYPES ================= */
.pic-row {
  font-weight: bold;
  cursor: pointer;
}

.customer-row {
  background: #eef3ff;
  cursor: pointer;
}

.invoice-row {
  background: #fafbff;
  font-size: 13px;
}

.invoice-row td:first-child {
  padding-left: 26px;
}

.customer-row td:first-child {
  padding-left: 14px;
}

/* ================= COLORS ================= */
.red { color: var(--red); font-weight: bold; }
.green { color: var(--green); font-weight: bold; }

/* ================= INPUT ================= */
input {
  width: 70px;
  padding: 4px;
  font-size: 13px;
}

/* ================= TOGGLE ================= */
.collapsed {
  display: none;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {
  h1 {
    font-size: 20px;
  }

  .summary .amount {
    font-size: 18px;
  }

  table {
    min-width: 620px;
  }

  thead th {
    font-size: 13px;
    padding: 8px 6px;
  }

  tbody td {
    font-size: 15px;      /* Bigger text */
    padding: 6px 6px;     /* Less padding */
  }

  input {
    font-size: 14px;
    width: 60px;
  }
}
</style>
</head>

<body>

<h1>Outstanding Receivables</h1>

<div class="summary">
  <div class="amount" id="netOutstanding">—</div>
  <div class="date" id="lastUpdated">Last updated: —</div>
</div>

<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Total</th>
        <th>On Account</th>
        <th>90+</th>
        <th>60–90</th>
        <th>30–60</th>
        <th>Forecast</th>
      </tr>
    </thead>
    <tbody id="app"></tbody>
  </table>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    render(data);
    updateSummary(data);
  });

function updateSummary(data) {
  let total = 0;
  let onAccount = 0;

  data.forEach(p => {
    total += sum(p.totals);
    Object.values(p.customers).forEach(c => {
      onAccount += c.onAccount || 0;
    });
  });

  document.getElementById("netOutstanding").innerText =
    "Net Outstanding: ₹" + (total - onAccount).toLocaleString();

  document.getElementById("lastUpdated").innerText =
    "Last refreshed: " + new Date().toLocaleString();
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.forEach(pic => {
    // PIC ROW
    const picRow = tr("pic-row", `
      <td>${pic.salesPIC}</td>
      <td>${sum(pic.totals)}</td>
      <td></td>
      <td class="red">${pic.totals["90+"]}</td>
      <td>${pic.totals["61-90"]}</td>
      <td>${pic.totals["31-60"]}</td>
      <td></td>
    `);

    picRow.onclick = () => togglePIC(pic.salesPIC);
    picRow.dataset.pic = pic.salesPIC;
    app.appendChild(picRow);

    Object.values(pic.customers).forEach(c => {
      // CUSTOMER ROW
      const custRow = tr("customer-row collapsed", `
        <td>${c.customerName}</td>
        <td>${sum(c.totals)}</td>
        <td class="green">${c.onAccount || 0}</td>
        <td class="red">${c.totals["90+"]}</td>
        <td>${c.totals["61-90"]}</td>
        <td>${c.totals["31-60"]}</td>
        <td>
          <input type="number"
            value="${c.forecast || ""}"
            onclick="event.stopPropagation()"
            onchange="saveForecast('${pic.salesPIC}','${c.customerName}',this.value)">
        </td>
      `);

      custRow.dataset.pic = pic.salesPIC;
      custRow.dataset.customer = c.customerName;
      custRow.onclick = () => toggleCustomer(pic.salesPIC, c.customerName);
      app.appendChild(custRow);

      // INVOICES
      c.invoices.forEach(i => {
        const invRow = tr("invoice-row collapsed", `
          <td>${i.invoiceNo}</td>
          <td>${i.total}</td>
          <td></td>
          <td class="red">${i.ageing["90+"]}</td>
          <td>${i.ageing["61-90"]}</td>
          <td>${i.ageing["31-60"]}</td>
          <td></td>
        `);

        invRow.dataset.pic = pic.salesPIC;
        invRow.dataset.customer = c.customerName;
        app.appendChild(invRow);
      });
    });
  });
}

function togglePIC(pic) {
  document.querySelectorAll(".customer-row").forEach(r => r.classList.add("collapsed"));
  document.querySelectorAll(".invoice-row").forEach(r => r.classList.add("collapsed"));

  document.querySelectorAll(`.customer-row[data-pic="${pic}"]`)
    .forEach(r => r.classList.toggle("collapsed"));
}

function toggleCustomer(pic, customer) {
  document.querySelectorAll(`.invoice-row[data-pic="${pic}"]`)
    .forEach(r => r.classList.add("collapsed"));

  document.querySelectorAll(
    `.invoice-row[data-pic="${pic}"][data-customer="${customer}"]`
  ).forEach(r => r.classList.toggle("collapsed"));
}

function sum(t) {
  return (t["90+"]||0)+(t["61-90"]||0)+(t["31-60"]||0)+(t["1-30"]||0);
}

function saveForecast(pic, customer, value) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateForecast",
      salesPIC: pic,
      customer: customer,
      forecast: Number(value)
    })
  });
}

function tr(cls, html) {
  const r = document.createElement("tr");
  r.className = cls;
  r.innerHTML = html;
  return r;
}
</script>

</body>
</html>
