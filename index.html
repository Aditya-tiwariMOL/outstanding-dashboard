<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MOL Outstanding Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root {
  --mol-blue: #1f4ea3;
  --mol-light: #eef3ff;
  --bg: #f8fafc;
  --card: #ffffff;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --success: #16a34a;
  --danger: #dc2626;
  --grid: rgba(0,0,0,0.06);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', Arial, sans-serif;
  background: var(--bg);
  color: var(--text-main);
  overflow-x: auto;
}

/* LOGIN */

.login-overlay{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.login-box{
  background:#fff;
  padding:40px;
  border-radius:12px;
  width:90%;
  max-width:400px;
  text-align:center;
  box-shadow:0 20px 25px rgba(0,0,0,.1);
}

.login-box img{max-width:180px;margin-bottom:20px;}

.login-box input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:1px solid #ddd;
  border-radius:6px;
}

.login-box button{
  width:100%;
  padding:12px;
  background:var(--mol-blue);
  color:#fff;
  border:none;
  border-radius:6px;
  font-weight:600;
}


/* HEADER */

.header-wrap{
  background:#fff;
  padding:20px;
  border-bottom:1px solid var(--grid);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.title-area h1{
  margin:0;
  color:var(--mol-blue);
  font-size:22px;
}

.date-status{
  font-size:13px;
  color:var(--text-muted);
  display:flex;
  align-items:center;
  gap:6px;
}

.date-status::before{
  content:'';
  width:8px;
  height:8px;
  background:var(--success);
  border-radius:50%;
}

.summary-badge{
  background:var(--mol-light);
  padding:10px 20px;
  border-radius:10px;
  border:1px solid rgba(31,78,163,.15);
  text-align:right;
  min-width:220px;
}

.summary-label{
  font-size:11px;
  font-weight:800;
  color:var(--mol-blue);
}

.amount-highlight{
  font-size:22px;
  font-weight:800;
  color:var(--mol-blue);
}


/* TABLE */

.table-wrapper{
  overflow-x:auto;
  padding:0 20px 40px;
  -webkit-overflow-scrolling:touch;
}

.row{
  display:grid;
  grid-template-columns:2fr 1fr 1fr .8fr .8fr .8fr .8fr 1fr;
  gap:10px;
  padding:14px;
  min-width:1000px;
  background:#fff;
  border-bottom:1px solid var(--grid);
  align-items:center;
  cursor:pointer;
}

.row > div{
  border-right:1px solid var(--grid);
  padding-right:6px;
}

.row > div:last-child{border-right:none;}

.header{
  background:var(--mol-blue);
  color:#fff;
  font-weight:600;
  border-radius:8px 8px 0 0;
  cursor:default;
}

.card{
  background:#fff;
  border-radius:8px;
  margin-top:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.1);
  overflow:hidden;
}

.customer{background:#fcfdfe;}
.invoice{
  background:#f0fdf4;
  padding-left:25px;
  border-left:4px solid #bbf7d0;
}

.on-account{color:var(--success);font-weight:700;}
.overdue{color:var(--danger);font-weight:700;}

.editable-placeholder{
  color:var(--mol-blue);
  text-decoration:underline;
  font-size:12px;
}

.editable-value{
  color:var(--mol-blue);
  font-weight:700;
  border-bottom:1px dashed var(--mol-blue);
}


/* DASHBOARD */

#dashboard{
  padding:0 20px 60px;
  max-width:1300px;
  margin:auto;
}

.section-title{
  text-align:center;
  color:var(--mol-blue);
  font-weight:700;
  margin-bottom:25px;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:20px;
}

.chart-box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  border:1px solid var(--grid);
  height:400px;
}


/* DRAWER */

.drawer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:10000;
}

.drawer-content{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:25px;
  border-radius:20px 20px 0 0;
  max-height:80vh;
  overflow:auto;
}

.drawer-actions{
  display:flex;
  gap:12px;
  margin-top:20px;
}

.drawer-actions button{
  flex:1;
  padding:12px;
  border-radius:8px;
  border:1px solid #ddd;
  font-weight:600;
}

.drawer-actions .primary{
  background:var(--mol-blue);
  color:#fff;
  border:none;
}


/* TOAST */

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--mol-blue);
  color:#fff;
  padding:12px 24px;
  border-radius:30px;
  display:none;
  z-index:10001;
  font-weight:600;
}


/* MOBILE */

@media(max-width:768px){

  .header-wrap{
    flex-direction:column;
    text-align:center;
    padding:12px 15px;
    gap:8px;
  }

  .title-area,
  .summary-badge{
    width:100%;
    text-align:center;
  }

  .row{
    font-size:13px;
    min-width:900px;
    grid-template-columns:
    160px 90px 80px 70px 70px 70px 70px 100px;
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }
}

.hidden{display:none;}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-overlay" id="loginOverlay">

  <div class="login-box">

    <img src="https://raw.githubusercontent.com/Aditya-tiwariMOL/outstanding-dashboard/main/MOL%20Logo%2001.png">

    <h2>MOL Receivables Access</h2>

    <input type="password" id="pwd" placeholder="Enter Access Code">

    <button onclick="checkPassword()">Log In</button>

    <div id="loginError" style="color:var(--danger);display:none;font-size:13px;">
      Invalid credentials
    </div>

  </div>

</div>


<div id="appContainer" style="display:none;">


<!-- HEADER -->

<div class="header-wrap">

  <div class="title-area">
    <h1>Outstanding Receivables</h1>
    <div class="date-status" id="lastUpdated">Updating...</div>
  </div>

  <div class="summary-badge">
    <div class="summary-label">Total Net Outstanding</div>
    <div class="amount-highlight" id="netOutstanding">₹0</div>
  </div>

</div>


<!-- TABLE -->

<div class="table-wrapper">

  <div class="row header">
    <div>Account Name</div>
    <div>Total OS</div>
    <div>On Acc</div>
    <div>90+</div>
    <div>60+</div>
    <div>30+</div>
    <div>1+</div>
    <div>Forecast</div>
  </div>

  <div id="app"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

  <h2 class="section-title">Visual Analytics</h2>

  <div class="dashboard-grid">

    <div class="chart-box">
      <canvas id="ageingChart"></canvas>
    </div>

    <div class="chart-box">
      <canvas id="picChart"></canvas>
    </div>

  </div>

  <div class="chart-box" style="margin-top:20px;height:500px;">
    <canvas id="defaulterChart"></canvas>
  </div>

</div>

</div>


<!-- DRAWER -->

<div id="forecastDrawer" class="drawer hidden">

  <div class="drawer-content">

    <div id="drawerCustomer"
      style="font-weight:800;font-size:18px;color:var(--mol-blue);"></div>

    <div id="drawerTotal"
      style="color:var(--text-muted);margin-bottom:15px;"></div>

    <input type="number" id="drawerInput"
      style="width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;"
      placeholder="Enter forecast">

    <div class="drawer-actions">

      <button onclick="closeDrawer()">Cancel</button>

      <button class="primary" onclick="saveDrawerForecast()">Save</button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

let preloadedData=null;

const API_URL="https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

const PASSWORD_HASH="9f7259520fecfc4f2ae2c2627cd625197070aa7a73d90938c680f8b5aaba747a";

const isMobile=window.innerWidth<=768;

const n=v=>Number(String(v||0).replace(/,/g,""));

const fmt=v=>n(v).toLocaleString('en-IN');

const sum=t=>n(t["90+"])+n(t["61-90"])+n(t["31-60"])+n(t["1-30"]);


/* HELPERS */

function stopEvent(e){ e.stopPropagation(); }

function showToast(msg){

  const t=document.getElementById('toast');

  t.innerText=msg;
  t.style.display="block";
  t.style.opacity="1";

  setTimeout(()=>{t.style.opacity="0"},2000);

  setTimeout(()=>{
    t.style.display="none";
    t.style.opacity="1";
  },2500);
}


/* LOGIN */

async function sha256(t){
  const b=await crypto.subtle.digest("SHA-256",
  new TextEncoder().encode(t));

  return [...new Uint8Array(b)]
  .map(x=>x.toString(16).padStart(2,"0")).join("");
}

async function checkPassword(){

  const input=document.getElementById('pwd').value;

  if(await sha256(input.trim())!==PASSWORD_HASH){
    document.getElementById('loginError').style.display="block";
    return;
  }

  loginOverlay.style.display="none";
  appContainer.style.display="block";

  const data=await fetch(API_URL).then(r=>r.json());

  preloadedData=data;

  render(data);
  updateSummary(data);
  renderDashboard(data);
}


/* SUMMARY */

function updateSummary(data){

  let t=0,o=0;

  data.forEach(p=>{
    t+=sum(p.totals);

    Object.values(p.customers)
    .forEach(c=>o+=n(c.onAccount));
  });

  netOutstanding.innerText="₹"+fmt(t-o);

  lastUpdated.innerText=
  "Refreshed: "+
  new Date().toLocaleTimeString([],{
    hour:'2-digit',
    minute:'2-digit'
  });
}


/* DASHBOARD */

function renderDashboard(data){

  const labelCfg={
    color:'#444',
    font:{size:isMobile?10:12,weight:'600'}
  };


  /* PIC CHART */

  const picData=data.map(p=>({
    name:p.salesPIC,
    val:sum(p.totals)
  }))
  .sort((a,b)=>b.val-a.val)
  .slice(0,10);


  new Chart(picChart,{
    type:'bar',
    plugins:[ChartDataLabels],

    data:{
      labels:picData.map(d=>d.name),
      datasets:[{
        data:picData.map(d=>d.val),
        backgroundColor:'#1f4ea3'
      }]
    },

    options:{
      indexAxis:'y',
      maintainAspectRatio:false,

      layout:{
        padding:{right:30}
      },

      scales:{
        x:{display:false},
        y:{grid:{display:false}}
      },

      plugins:{
        legend:{display:false},

        title:{
          display:true,
          text:'Performance by PIC'
        },

        datalabels:{
          ...labelCfg,
          anchor:'end',
          align:'right',
          formatter:v=>'₹'+(v/1000).toFixed(0)+'K'
        }
      }
    }
  });


  /* AGEING */

  const a=[0,0,0,0];

  data.forEach(p=>{
    a[0]+=n(p.totals["1-30"]);
    a[1]+=n(p.totals["31-60"]);
    a[2]+=n(p.totals["61-90"]);
    a[3]+=n(p.totals["90+"]);
  });


  new Chart(ageingChart,{
    type:'doughnut',
    plugins:[ChartDataLabels],

    data:{
      labels:["1-30","31-60","61-90","90+"],
      datasets:[{
        data:a,
        backgroundColor:['#1f4ea3','#3b82f6','#60a5fa','#93c5fd']
      }]
    },

    options:{
      maintainAspectRatio:false,

      plugins:{
        legend:{position:'bottom'},

        title:{
          display:true,
          text:'Ageing Distribution'
        },

        datalabels:{
          color:'#fff',
          formatter:(v,c)=>{
            return ((v/c.dataset.data.reduce((x,y)=>x+y,0))*100)
            .toFixed(0)+'%';
          }
        }
      }
    }
  });


  /* DEFAULTERS */

  const defs=[];

  data.forEach(p=>{
    Object.values(p.customers).forEach(c=>{
      if(n(c.totals["90+"])>0){
        defs.push({
          n:c.customerName,
          v:n(c.totals["90+"])
        });
      }
    });
  });

  const topDefs=defs.sort((a,b)=>b.v-a.v).slice(0,10);


  new Chart(defaulterChart,{
    type:'bar',
    plugins:[ChartDataLabels],

    data:{
      labels:topDefs.map(d=>d.n),
      datasets:[{
        data:topDefs.map(d=>d.v),
        backgroundColor:'#dc2626'
      }]
    },

    options:{
      indexAxis:'y',
      maintainAspectRatio:false,

      layout:{
        padding:{right:30}
      },

      scales:{
        x:{display:false},
        y:{grid:{display:false}}
      },

      plugins:{
        legend:{display:false},

        title:{
          display:true,
          text:'Top 10 Defaulters (90+ Days)',
          color:'#dc2626'
        },

        datalabels:{
          ...labelCfg,
          anchor:'end',
          align:'right',
          formatter:v=>'₹'+fmt(v)
        }
      }
    }
  });

}


/* TABLE */

function render(data){

  app.innerHTML="";

  let openPIC=null,openCust=null;

  data.forEach(pic=>{

    const card=document.createElement('div');
    card.className="card";


    const picRow=document.createElement('div');
    picRow.className="row";


    picRow.innerHTML=`

      <div style="font-weight:700;color:var(--mol-blue)">
      ${pic.salesPIC}</div>

      <div>${fmt(sum(pic.totals))}</div>
      <div>-</div>

      <div class="overdue">${fmt(pic.totals["90+"])}</div>
      <div>${fmt(pic.totals["61-90"])}</div>
      <div>${fmt(pic.totals["31-60"])}</div>
      <div>${fmt(pic.totals["1-30"])}</div>
      <div>-</div>
    `;


    const picWrap=document.createElement('div');
    picWrap.className="hidden";


    picRow.onclick=()=>{

      if(openPIC && openPIC!==picWrap)
        openPIC.classList.add('hidden');

      picWrap.classList.toggle('hidden');

      openPIC=picWrap.classList.contains('hidden')
      ?null:picWrap;
    };


    Object.values(pic.customers).forEach(c=>{


      const custRow=document.createElement('div');
      custRow.className="row customer";

      const invWrap=document.createElement('div');
      invWrap.className="hidden";


      custRow.innerHTML=`

        <div>${c.customerName}</div>

        <div>${fmt(sum(c.totals))}</div>

        <div class="on-account">${fmt(c.onAccount)}</div>

        <div class="overdue">${fmt(c.totals["90+"])}</div>

        <div>${fmt(c.totals["61-90"])}</div>
        <div>${fmt(c.totals["31-60"])}</div>
        <div>${fmt(c.totals["1-30"])}</div>

        <div>

        ${isMobile?

        `<span
          class="${c.forecast?'editable-value':'editable-placeholder'}"
          onclick="stopEvent(event);
          openDrawer('${pic.salesPIC}',
          '${c.customerName}',
          '${sum(c.totals)}',
          '${c.forecast||""}')">

          ${c.forecast?fmt(c.forecast):'Add'}

        </span>`


        :

        `<input type="text"
          value="${c.forecast||''}"
          onchange="saveForecast(
          '${pic.salesPIC}',
          '${c.customerName}',
          this.value)">`
        }

        </div>
      `;


      custRow.onclick=e=>{

        e.stopPropagation();

        if(openCust && openCust!==invWrap)
          openCust.classList.add('hidden');

        invWrap.classList.toggle('hidden');

        openCust=invWrap.classList.contains('hidden')
        ?null:invWrap;
      };


      c.invoices.forEach(i=>{

        const invRow=document.createElement('div');
        invRow.className="row invoice";


        invRow.innerHTML=`

          <div>Inv: ${i.invoiceNo}</div>
          <div>${fmt(i.total)}</div>
          <div>-</div>

          <div class="${i.ageing['90+']?'overdue':''}">
          ${fmt(i.ageing['90+']||0)}</div>

          <div>${fmt(i.ageing['61-90']||0)}</div>
          <div>${fmt(i.ageing['31-60']||0)}</div>
          <div>${fmt(i.ageing['1-30']||0)}</div>
          <div>-</div>
        `;

        invWrap.appendChild(invRow);
      });


      picWrap.appendChild(custRow);
      picWrap.appendChild(invWrap);

    });


    card.appendChild(picRow);
    card.appendChild(picWrap);

    app.appendChild(card);

  });
}


/* DRAWER */

let drawerPIC,drawerCust;

function openDrawer(pic,cust,tot,fc){

  drawerPIC=pic;
  drawerCust=cust;

  drawerCustomer.innerText=cust;

  drawerTotal.innerText=
  "Outstanding: ₹"+fmt(tot);

  drawerInput.value=fc;

  forecastDrawer.classList.remove('hidden');
}

function closeDrawer(){
  forecastDrawer.classList.add('hidden');
}

function saveDrawerForecast(){

  saveForecast(
    drawerPIC,
    drawerCust,
    drawerInput.value
  );

  closeDrawer();
}


/* SAVE */

function saveForecast(pic,cust,val){

  fetch(API_URL,{
    method:'POST',
    body:JSON.stringify({
      action:'updateForecast',
      salesPIC:pic,
      customer:cust,
      forecast:n(val)
    })
  })

  .then(()=>{

    preloadedData.forEach(p=>{
      if(p.salesPIC===pic){

        Object.values(p.customers)
        .forEach(c=>{
          if(c.customerName===cust)
            c.forecast=n(val);
        });
      }
    });

    render(preloadedData);
    updateSummary(preloadedData);
    renderDashboard(preloadedData);

    showToast("Forecast updated successfully");

  });
}

</script>

</body>
</html>
