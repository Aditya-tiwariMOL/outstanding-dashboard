<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOL Outstanding Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
    /* ... (Keep your existing CSS exactly as it is) ... */
    :root{--mol-blue:#1f4ea3;--bg:#f4f6fb;--success:#1a7f37;--danger:#ef4444;--grid:rgba(0,0,0,.06);}
    body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:#333;}
    .login-overlay{position:fixed;inset:0;background:#f4f6fb;display:flex;align-items:center;justify-content:center;z-index:9999;}
    .login-box{background:#fff;padding:30px;border-radius:10px;max-width:360px;width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.15);}
    .login-box img{max-width:150px;}
    .login-box input, .login-box button{width:100%;max-width:260px;margin:12px auto;padding:10px;font-size:15px;}
    .login-box button{background:var(--mol-blue);color:#fff;border:none;border-radius:4px;cursor:pointer;}
    .kpi-header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:18px 20px;border-radius:12px;margin:16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
    .kpi-left h1{margin:0;font-size:22px;color:var(--mol-blue);}
    .kpi-card{background:#eef3ff;padding:12px 18px;border-radius:10px;min-width:170px;text-align:right;}
    .table-wrapper{overflow-x:auto;padding:0 12px 30px;}
    .row{display:grid;grid-template-columns:2fr 1.1fr 1fr .9fr .9fr .9fr .9fr 1fr 1.5fr;gap:6px;padding:10px;min-width:900px;background:#fff;border-bottom:1px solid var(--grid);font-size:18px;}
    .header{background:var(--mol-blue);color:#fff;font-weight:bold;}
    .customer{background:#eef3ff;}
    .invoice{padding-left:18px;background:#E5FDEB;font-size:16px;}
    .hidden{display:none;}
    .drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10000;}
    .drawer-content{position:absolute;bottom:0;left:0;right:0;background:#fff;padding:16px;border-radius:14px 14px 0 0;}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--mol-blue);color:#fff;padding:10px 18px;border-radius:20px;display:none;}
    /* Filter Bar Styles */
    .filter-bar{display:flex;justify-content:center;gap:14px;margin:15px 0 20px;}
    .filter-box{background:#f1f5ff;padding:6px 10px;border-radius:20px;border:1px solid rgba(31,78,163,0.15);}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <img src="https://raw.githubusercontent.com/Aditya-tiwariMOL/outstanding-dashboard/main/MOL%20Logo%2001.png">
        <h2>MOL LOGISTICS (INDIA) PVT LTD</h2>
        <input type="password" id="pwd" placeholder="Enter access code">
        <button onclick="checkPassword()">Submit</button>
        <div class="login-error" id="loginError" style="display:none; color:red;">Invalid access code</div>
    </div>
</div>

<div id="appContainer" style="display:none;">
    <div class="kpi-header">
        <div class="kpi-left">
            <h1>Outstanding Receivables</h1>
            <div class="updated" id="lastUpdated">—</div>
        </div>
        <div class="kpi-right">
            <div class="kpi-card"><div class="kpi-label">Net Outstanding</div><div class="kpi-value" id="netOutstanding">—</div></div>
            <div class="kpi-card forecast"><div class="kpi-label">Forecast Receivables</div><div class="kpi-value" id="forecastOutstanding">—</div></div>
        </div>
    </div>

    <div class="table-wrapper">
        <div class="row header">
            <div>Name</div><div>Total OS</div><div>On Acc</div><div>90+</div><div>60+</div><div>30+</div><div>1+</div><div>Fcst</div><div>Remark</div>
        </div>
        <div id="app"></div>
    </div>

    <div id="dashboard">
        <div class="filter-bar">
            <div class="filter-box"><span>Region</span><select id="regionFilter" onchange="applyFilters()"><option value="">All</option></select></div>
            <div class="filter-box"><span>Category</span><select id="categoryFilter" onchange="applyFilters()"><option value="">All</option></select></div>
            <button onclick="clearFilters()">Clear</button>
        </div>
        <div class="dashboard-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
            <div class="chart-box"><canvas id="ageingChart"></canvas></div>
            <div class="chart-box"><canvas id="picChart"></canvas></div>
        </div>
        <div class="chart-box tall" style="height:400px; margin-top:20px;"><canvas id="defaulterChart"></canvas></div>
    </div>
</div>

<div id="forecastDrawer" class="drawer hidden">
    <div class="drawer-content">
        <div id="drawerCustomer" style="font-weight:bold;">—</div>
        <div id="drawerTotal" style="color:#666;font-size:13px;margin-bottom:10px;">—</div>
        <input type="number" id="drawerForecast" style="width:100%;padding:10px;" placeholder="Enter forecast">
        <input type="text" id="drawerRemark" maxlength="60" style="width:100%;padding:10px;margin-top:10px;" placeholder="Enter remark">
        <div class="drawer-actions" style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="closeDrawer()">Cancel</button>
            <button style="background:#1f4ea3; color:#fff; flex:1;" onclick="saveDrawerForecast()">Save</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">Update Successful</div>

<script>
const API_URL = "YOUR_DEPLOYED_SCRIPT_URL_HERE"; 
const PASSWORD_HASH = "9f7259520fecfc4f2ae2c2627cd625197070aa7a73d90938c680f8b5aaba747a";

let preloadedData = null;
let filteredData = null;
const n = v => Number(String(v || 0).replace(/,/g, ""));
const fmt = v => n(v).toLocaleString();
const sum = t => n(t["90+"]) + n(t["61-90"]) + n(t["31-60"]) + n(t["1-30"]);
const isMobile = window.innerWidth <= 768;

async function sha256(t) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

async function checkPassword() {
    const entered = document.getElementById("pwd").value;
    if (await sha256(entered.trim()) !== PASSWORD_HASH) {
        document.getElementById("loginError").style.display = "block";
        return;
    }
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("appContainer").style.display = "block";
    loadData();
}

function loadData() {
    fetch(API_URL).then(r => r.json()).then(data => {
        preloadedData = data;
        setupFilters(data);
        applyFilters();
    });
}

function render(data) {
    const container = document.getElementById("app");
    container.innerHTML = "";
    data.forEach(pic => {
        const card = document.createElement("div");
        card.className = "card";
        const picRow = document.createElement("div");
        picRow.className = "row";
        picRow.innerHTML = `<div>${pic.salesPIC}</div><div>${fmt(sum(pic.totals))}</div><div></div><div style="color:red">${fmt(pic.totals["90+"])}</div><div>${fmt(pic.totals["61-90"])}</div><div>${fmt(pic.totals["31-60"])}</div><div>${fmt(pic.totals["1-30"])}</div><div></div><div></div>`;
        
        const wrap = document.createElement("div");
        wrap.className = "hidden";
        picRow.onclick = () => wrap.classList.toggle("hidden");

        Object.values(pic.customers).forEach(c => {
            const r = document.createElement("div");
            r.className = "row customer";
            r.innerHTML = `
                <div>${c.customerName}</div><div>${fmt(sum(c.totals))}</div><div style="color:green">${fmt(c.onAccount)}</div><div style="color:red">${fmt(c.totals["90+"])}</div><div>${fmt(c.totals["61-90"])}</div><div>${fmt(c.totals["31-60"])}</div><div>${fmt(c.totals["1-30"])}</div>
                <div onclick="event.stopPropagation(); openDrawer('${c.rowId}','${c.customerName}','${sum(c.totals)}','${c.forecast}','${c.remark}')" style="cursor:pointer; color:blue; text-decoration:underline;">${c.forecast ? fmt(c.forecast) : 'Add'}</div>
                <div onclick="event.stopPropagation(); openDrawer('${c.rowId}','${c.customerName}','${sum(c.totals)}','${c.forecast}','${c.remark}')" style="cursor:pointer; color:blue; text-decoration:underline; font-size:12px;">${c.remark || 'Add'}</div>
            `;
            wrap.appendChild(r);
        });
        card.appendChild(picRow);
        card.appendChild(wrap);
        container.appendChild(card);
    });
}

// DRAWER & SAVE LOGIC
let currentActiveRowId = null;

function openDrawer(rowId, cust, tot, fcst, rem) {
    currentActiveRowId = rowId;
    document.getElementById("drawerCustomer").innerText = cust;
    document.getElementById("drawerTotal").innerText = "Total: ₹" + fmt(tot);
    document.getElementById("drawerForecast").value = fcst || "";
    document.getElementById("drawerRemark").value = rem || "";
    document.getElementById("forecastDrawer").classList.remove("hidden");
}

function closeDrawer() { document.getElementById("forecastDrawer").classList.add("hidden"); }

async function saveDrawerForecast() {
    const fVal = document.getElementById("drawerForecast").value;
    const rVal = document.getElementById("drawerRemark").value;
    const rowId = currentActiveRowId;

    // Send both updates
    await Promise.all([
        postUpdate("updateForecast", { rowId: rowId, forecast: n(fVal) }),
        postUpdate("updateRemark", { rowId: rowId, remark: rVal })
    ]);

    // Update local data so UI refreshes without reload
    preloadedData.forEach(p => {
        Object.values(p.customers).forEach(c => {
            if (c.rowId == rowId) { c.forecast = fVal; c.remark = rVal; }
        });
    });

    closeDrawer();
    applyFilters();
    showToast();
}

async function postUpdate(action, extra) {
    return fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action, ...extra })
    });
}

function showToast() {
    const t = document.getElementById("toast");
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2000);
}

/* (Include your existing applyFilters, clearFilters, updateSummary, and renderDashboard logic here) */
function applyFilters() {
    const r = document.getElementById("regionFilter").value;
    const c = document.getElementById("categoryFilter").value;
    filteredData = preloadedData.map(p => {
        const cust = {};
        Object.values(p.customers).forEach(x => {
            if ((!r || x.region === r) && (!c || x.category === c)) cust[x.customerName] = x;
        });
        return { ...p, customers: cust };
    }).filter(p => Object.keys(p.customers).length);
    render(filteredData);
    // updateSummary and renderDashboard calls go here...
}

function setupFilters(data) {
    const rSet = new Set(), cSet = new Set();
    data.forEach(p => Object.values(p.customers).forEach(c => { if(c.region) rSet.add(c.region); if(c.category) cSet.add(c.category); }));
    const rf = document.getElementById("regionFilter"), cf = document.getElementById("categoryFilter");
    rSet.forEach(r => rf.innerHTML += `<option>${r}</option>`);
    cSet.forEach(c => cf.innerHTML += `<option>${c}</option>`);
}
</script>
</body>
</html>
