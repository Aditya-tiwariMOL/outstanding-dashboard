<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
:root {
  --mol-blue: #1f4ea3;
  --bg: #f4f6fb;
  --card: #ffffff;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #000;
}

/* ---------- HEADER ---------- */
h1 {
  text-align: center;
  color: var(--mol-blue);
  margin: 16px 0 6px;
  font-size: 22px;
}

.summary {
  text-align: center;
  margin-bottom: 14px;
}

.summary .amount {
  font-size: 18px;
  font-weight: bold;
}

.summary .date {
  font-size: 11px;
  color: #555;
}

/* ---------- TABLE WRAPPER ---------- */
.table-wrapper {
  overflow-x: auto;
  padding: 0 8px 30px;
  -webkit-overflow-scrolling: touch;
}

/* ---------- ROW BASE ---------- */
.row {
  display: grid;
  grid-template-columns:
    160px  /* Name */
    90px   /* Total */
    90px   /* On Account */
    70px   /* 90+ */
    70px   /* 60–90 */
    70px   /* 30–60 */
    100px; /* Forecast */
  align-items: center;
  min-width: 650px;
  padding: 8px 6px;
  gap: 6px;
  font-size: 13px;
}

/* ---------- HEADER ROW ---------- */
.header {
  background: var(--mol-blue);
  color: #fff;
  font-weight: bold;
  position: sticky;
  top: 0;
  z-index: 10;
  border-radius: 6px;
}

/* ---------- CARDS ---------- */
.card {
  background: var(--card);
  border-radius: 6px;
  margin-top: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

/* ---------- SALES PIC ---------- */
.row.pic {
  font-weight: bold;
}

/* ---------- CUSTOMER ---------- */
.customer {
  background: #eef3ff;
  padding-left: 14px;
}

/* ---------- INVOICE ---------- */
.invoice {
  padding-left: 28px;
  font-size: 12px;
  color: #333;
}

/* ---------- INPUT ---------- */
input {
  width: 100%;
  padding: 5px 6px;
  font-size: 13px;
  box-sizing: border-box;
}

/* ---------- STICKY NAME COLUMN ---------- */
.row > div:first-child {
  position: sticky;
  left: 0;
  background: inherit;
  z-index: 2;
}

/* ---------- TOAST ---------- */
.toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--mol-blue);
  color: #fff;
  padding: 8px 16px;
  border-radius: 18px;
  font-size: 13px;
  display: none;
}

/* ---------- MOBILE FINE TUNING ---------- */
@media (max-width: 480px) {
  h1 {
    font-size: 20px;
  }

  .summary .amount {
    font-size: 16px;
  }

  .row {
    font-size: 12px;
    padding: 6px 4px;
  }

  input {
    font-size: 12px;
    padding: 4px 5px;
  }
}
</style>
</head>

<body>

<h1>Outstanding Receivables</h1>

<div class="summary">
  <div class="amount" id="netOutstanding">—</div>
  <div class="date" id="lastUpdated">Last updated: —</div>
</div>

<div class="table-wrapper">
  <div class="row header">
    <div>Name</div>
    <div>Total</div>
    <div>On Account</div>
    <div>90+</div>
    <div>60–90</div>
    <div>30–60</div>
    <div>Forecast</div>
  </div>

  <div id="app"></div>
</div>

<div class="toast" id="toast">Forecast updated</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

let openPIC = null;
let openCustomer = null;

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    render(data);
    updateSummary(data);
  });

function updateSummary(data) {
  let totalOutstanding = 0;
  let totalOnAccount = 0;

  data.forEach(p => {
    totalOutstanding += sum(p.totals);
    Object.values(p.customers).forEach(c => {
      totalOnAccount += c.onAccount || 0;
    });
  });

  document.getElementById("netOutstanding").innerText =
    "Net Outstanding: ₹" + (totalOutstanding - totalOnAccount).toLocaleString();

  document.getElementById("lastUpdated").innerText =
    "Last refreshed: " + new Date().toLocaleString();
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.forEach(pic => {
    const card = document.createElement("div");
    card.className = "card";

    const picRow = createPICRow(pic);
    const customerContainer = document.createElement("div");
    customerContainer.className = "hidden";

    picRow.onclick = () => toggle(customerContainer, "pic");

    Object.values(pic.customers).forEach(c => {
      const customerRow = createCustomerRow(pic.salesPIC, c);
      const invoiceContainer = document.createElement("div");
      invoiceContainer.className = "hidden";

      customerRow.onclick = () => toggle(invoiceContainer, "customer");

      c.invoices.forEach(i => {
        const inv = document.createElement("div");
        inv.className = "row invoice";
        inv.innerHTML = `
          <div>${i.invoiceNo}</div>
          <div>${i.total}</div>
          <div></div>
          <div>${i.ageing["90+"]}</div>
          <div>${i.ageing["61-90"]}</div>
          <div>${i.ageing["31-60"]}</div>
          <div></div>
        `;
        invoiceContainer.appendChild(inv);
      });

      customerContainer.appendChild(customerRow);
      customerContainer.appendChild(invoiceContainer);
    });

    card.appendChild(picRow);
    card.appendChild(customerContainer);
    app.appendChild(card);
  });
}

function createPICRow(pic) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `
    <div>${pic.salesPIC}</div>
    <div>${sum(pic.totals)}</div>
    <div></div>
    <div>${pic.totals["90+"]}</div>
    <div>${pic.totals["61-90"]}</div>
    <div>${pic.totals["31-60"]}</div>
    <div></div>
  `;
  return row;
}

function createCustomerRow(picName, c) {
  const row = document.createElement("div");
  row.className = "row customer";

  row.innerHTML = `
    <div>${c.customerName}</div>
    <div>${sum(c.totals)}</div>
    <div>${c.onAccount || 0}</div>
    <div>${c.totals["90+"]}</div>
    <div>${c.totals["61-90"]}</div>
    <div>${c.totals["31-60"]}</div>
    <div>
      <input type="number"
        value="${c.forecast || ""}"
        onclick="event.stopPropagation()"
        onchange="saveForecast('${picName}','${c.customerName}',this.value)">
    </div>
  `;
  return row;
}

function sum(t) {
  return (t["90+"] || 0) + (t["61-90"] || 0) + (t["31-60"] || 0) + (t["1-30"] || 0);
}

function toggle(el, level) {
  if (level === "pic" && openPIC && openPIC !== el) openPIC.classList.add("hidden");
  if (level === "customer" && openCustomer && openCustomer !== el) openCustomer.classList.add("hidden");

  el.classList.toggle("hidden");

  if (level === "pic") openPIC = el.classList.contains("hidden") ? null : el;
  if (level === "customer") openCustomer = el.classList.contains("hidden") ? null : el;
}

function saveForecast(pic, customer, value) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateForecast",
      salesPIC: pic,
      customer: customer,
      forecast: Number(value)
    })
  }).then(showToast);
}

function showToast() {
  const t = document.getElementById("toast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}
</script>

</body>
</html>
