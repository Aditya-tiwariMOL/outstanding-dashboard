<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
:root {
  --mol-blue:#1f4ea3;
  --bg:#f4f6fb;
  --card:#ffffff;
  --success:#1a7f37;
  --danger:#c62828;
  --grid:rgba(0,0,0,0.06);
}

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
}

/* ================= LOGIN ================= */
.login-overlay {
  position:fixed;
  inset:0;
  background:#f4f6fb;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.login-box {
  background:#fff;
  padding:32px 28px;
  border-radius:10px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.login-box img {
  max-width:160px;
  margin-bottom:14px;
}

.login-box h2 {
  margin:0 0 18px;
  font-size:16px;
  color:var(--mol-blue);
}

/* 🔧 FIXED INPUT WIDTH */
.login-box input {
  width:100%;
  max-width:260px;
  padding:10px;
  font-size:15px;
  margin:0 auto 14px;
  display:block;
}

.login-box button {
  width:100%;
  max-width:260px;
  padding:10px;
  font-size:15px;
  background:var(--mol-blue);
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

.login-error {
  color:#c62828;
  font-size:12px;
  margin-top:10px;
  display:none;
}

/* ================= HEADER ================= */
.header-wrap {
  text-align:center;
  margin:14px 0 12px;
}

h1 {
  margin:0;
  font-size:22px;
  color:var(--mol-blue);
}

.summary .amount {
  font-size:18px;
  font-weight:bold;
}

.summary .date {
  font-size:11px;
  color:#666;
}

/* ================= TABLE ================= */
.table-wrapper {
  overflow-x:auto;
  padding:0 12px 20px;
}

.row {
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr;
  gap:8px;
  padding:12px;
  min-width:900px;
  background:#fff;
  border-bottom:1px solid var(--grid);
  font-size:18px;
}

.row > div {
  border-right:1px solid var(--grid);
  padding-right:6px;
}
.row > div:last-child { border-right:none; }

.header {
  background:var(--mol-blue);
  color:#fff;
  font-weight:bold;
  border-radius:6px;
}

.card {
  background:var(--card);
  border-radius:6px;
  margin-top:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.customer { background:#eef3ff; }

.invoice {
  padding-left:20px;
  background:#E5FDEB;
  border-left:3px solid rgba(26,127,55,0.18);
  font-size:16px;
}

.hidden { display:none; }

.on-account { color:var(--success); font-weight:bold; }
.overdue { color:var(--danger); font-weight:bold; }

input {
  width:100%;
  padding:6px;
  font-size:16px;
}

/* ================= NOTE ================= */
.total-note {
  font-size:11px;
  color:#777;
  text-align:center;
  margin:6px 12px 30px;
}

/* ================= TOAST ================= */
.toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--mol-blue);
  color:#fff;
  padding:10px 18px;
  border-radius:20px;
  display:none;
}

/* ================= MOBILE ================= */
@media (max-width:768px) {
  h1 { font-size:18px; }
  .summary .amount { font-size:16px; }
  .summary .date { font-size:10px; }

  .row {
    font-size:15px;
    padding:12px 6px;
    gap:6px;
    min-width:740px;
  }

  .total-note { font-size:10px; }
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->

  <div class="login-box">
    <img src="https://raw.githubusercontent.com/Aditya-tiwariMOL/outstanding-dashboard/main/MOL%20Logo%2001.png">
