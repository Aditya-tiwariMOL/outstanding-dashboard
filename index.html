<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outstanding Receivables</title>

<style>
/* =====================
   THEME
   ===================== */
:root {
  --mol-blue: #1f4ea3;
  --bg: #f5f7fb;
  --card: #ffffff;
  --border: #e3e6ef;
  --text-muted: #666;
}

/* =====================
   BASE
   ===================== */
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: #111;
}

/* =====================
   HEADER
   ===================== */
h1 {
  text-align: center;
  color: var(--mol-blue);
  margin: 16px 0 4px;
  font-size: 22px;
  font-weight: 600;
}

.summary {
  text-align: center;
  margin-bottom: 14px;
}

.summary .amount {
  font-size: 18px;
  font-weight: 600;
}

.summary .date {
  font-size: 11px;
  color: var(--text-muted);
}

/* =====================
   TABLE WRAPPER
   ===================== */
.table-wrapper {
  overflow-x: auto;
  padding: 0 10px 28px;
}
.hidden {
  display: none;
}
   
/* =====================
   ROW LAYOUT
   ===================== */
.row {
  display: grid;
  grid-template-columns:
    180px
    90px
    90px
    70px
    70px
    70px
    100px;
  align-items: center;
  min-width: 700px;
  padding: 8px 10px;
  gap: 8px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}

/* =====================
   HEADER ROW
   ===================== */
.header {
  background: var(--mol-blue);
  color: #fff;
  font-weight: 600;
  border-radius: 6px;
  border-bottom: none;
}

/* =====================
   CARDS
   ===================== */
.card {
  background: var(--card);
  border-radius: 6px;
  margin-top: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  overflow: hidden;
}

/* =====================
   SALES PIC
   ===================== */
.card > .row {
  font-weight: 600;
  background: #fff;
  cursor: pointer;
}

/* =====================
   CUSTOMER
   ===================== */
.customer {
  background: #f1f5ff;
  padding-left: 18px;
  font-weight: 500;
}

/* =====================
   INVOICE
   ===================== */
.invoice {
  padding-left: 36px;
  font-size: 12px;
  color: #333;
  background: #fafbff;
}

/* =====================
   INPUT
   ===================== */
input {
  width: 100%;
  padding: 6px 8px;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: 4px;
}

input:focus {
  outline: none;
  border-color: var(--mol-blue);
}

/* =====================
   TOAST
   ===================== */
.toast {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--mol-blue);
  color: #fff;
  padding: 8px 18px;
  border-radius: 18px;
  font-size: 13px;
  display: none;
}

/* =====================
   MOBILE
   ===================== */
@media (max-width: 768px) {

  h1 {
    font-size: 20px;
  }

  .summary .amount {
    font-size: 16px;
  }

  .row {
    font-size: 12px;
    padding: 6px 8px;
    min-width: 720px;
  }

  .customer {
    padding-left: 14px;
  }

  .invoice {
    padding-left: 28px;
    font-size: 11px;
  }

  input {
    font-size: 12px;
    padding: 5px 6px;
  }
}
</style>
</head>

<body>

<h1>Outstanding Receivables</h1>

<div class="summary">
  <div class="amount" id="netOutstanding">—</div>
  <div class="date" id="lastUpdated">Last updated: —</div>
</div>

<div class="table-wrapper">
  <div class="row header">
    <div>Name</div>
    <div>Total</div>
    <div>On Account</div>
    <div>90+</div>
    <div>60–90</div>
    <div>30–60</div>
    <div>Forecast</div>
  </div>

  <div id="app"></div>
</div>

<div class="toast" id="toast">Forecast updated</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmQV1ULJx-CZyqWanibqRuj5UV5qSmChaTFoCzIrNUBIRF9ST6tVr1JQ8w-GxdR1oB/exec";

let openPIC = null;
let openCustomer = null;

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    render(data);
    updateSummary(data);
  });

function updateSummary(data) {
  let totalOutstanding = 0;
  let totalOnAccount = 0;

  data.forEach(p => {
    totalOutstanding += sum(p.totals);
    Object.values(p.customers).forEach(c => {
      totalOnAccount += c.onAccount || 0;
    });
  });

  document.getElementById("netOutstanding").innerText =
    "Net Outstanding: ₹" + (totalOutstanding - totalOnAccount).toLocaleString();

  document.getElementById("lastUpdated").innerText =
    "Last refreshed: " + new Date().toLocaleString();
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  data.forEach(pic => {
    const card = document.createElement("div");
    card.className = "card";

    const picRow = createPICRow(pic);
    const customerContainer = document.createElement("div");
    customerContainer.className = "hidden";

    picRow.onclick = () => toggle(customerContainer, "pic");

    Object.values(pic.customers).forEach(c => {
      const customerRow = createCustomerRow(pic.salesPIC, c);
      const invoiceContainer = document.createElement("div");
      invoiceContainer.className = "hidden";

      customerRow.onclick = () => toggle(invoiceContainer, "customer");

      c.invoices.forEach(i => {
        const inv = document.createElement("div");
        inv.className = "row invoice";
        inv.innerHTML = `
          <div>${i.invoiceNo}</div>
          <div>${i.total}</div>
          <div></div>
          <div>${i.ageing["90+"]}</div>
          <div>${i.ageing["61-90"]}</div>
          <div>${i.ageing["31-60"]}</div>
          <div></div>
        `;
        invoiceContainer.appendChild(inv);
      });

      customerContainer.appendChild(customerRow);
      customerContainer.appendChild(invoiceContainer);
    });

    card.appendChild(picRow);
    card.appendChild(customerContainer);
    app.appendChild(card);
  });
}

function createPICRow(pic) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `
    <div>${pic.salesPIC}</div>
    <div>${sum(pic.totals)}</div>
    <div></div>
    <div>${pic.totals["90+"]}</div>
    <div>${pic.totals["61-90"]}</div>
    <div>${pic.totals["31-60"]}</div>
    <div></div>
  `;
  return row;
}

function createCustomerRow(picName, c) {
  const row = document.createElement("div");
  row.className = "row customer";

  row.innerHTML = `
    <div>${c.customerName}</div>
    <div>${sum(c.totals)}</div>
    <div>${c.onAccount || 0}</div>
    <div>${c.totals["90+"]}</div>
    <div>${c.totals["61-90"]}</div>
    <div>${c.totals["31-60"]}</div>
    <div>
      <input type="number"
        value="${c.forecast || ""}"
        onclick="event.stopPropagation()"
        onchange="saveForecast('${picName}','${c.customerName}',this.value)">
    </div>
  `;
  return row;
}

function sum(t) {
  return (t["90+"] || 0) + (t["61-90"] || 0) + (t["31-60"] || 0) + (t["1-30"] || 0);
}

function toggle(el, level) {
  if (level === "pic" && openPIC && openPIC !== el) openPIC.classList.add("hidden");
  if (level === "customer" && openCustomer && openCustomer !== el) openCustomer.classList.add("hidden");

  el.classList.toggle("hidden");

  if (level === "pic") openPIC = el.classList.contains("hidden") ? null : el;
  if (level === "customer") openCustomer = el.classList.contains("hidden") ? null : el;
}

function saveForecast(pic, customer, value) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateForecast",
      salesPIC: pic,
      customer: customer,
      forecast: Number(value)
    })
  }).then(showToast);
}

function showToast() {
  const t = document.getElementById("toast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}
</script>

</body>
</html>
