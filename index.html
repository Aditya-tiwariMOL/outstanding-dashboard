<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOL Outstanding Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>

:root{
--mol-blue:#1f4ea3;
--bg:#f4f6fb;
--success:#1a7f37;
--danger:#ef4444;
--grid:rgba(0,0,0,.06);
}

/* BASE */

body{
margin:0;
font-family:'Segoe UI',Arial,sans-serif;
background:var(--bg);
color:#333;
}

/* LOGIN */

.login-overlay{
position:fixed;
inset:0;
background:#f4f6fb;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.login-box{
background:#fff;
padding:30px;
border-radius:10px;
max-width:360px;
width:90%;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.login-box img{max-width:150px;}

.login-box h2{
font-size:16px;
color:var(--mol-blue);
}

.login-box input,
.login-box button{
width:100%;
max-width:260px;
margin:12px auto;
padding:10px;
font-size:15px;
}

.login-box button{
background:var(--mol-blue);
color:#fff;
border:none;
border-radius:4px;
cursor:pointer;
}

.login-error{
color:#c62828;
font-size:12px;
display:none;
}

/* KPI HEADER */

.kpi-header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;

background:#fff;
padding:18px 20px;
border-radius:12px;
margin:16px 12px;

box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.kpi-left h1{
margin:0;
font-size:22px;
color:var(--mol-blue);
font-weight:600;
}

.kpi-left .updated{
font-size:12px;
color:#64748b;
margin-top:6px;
}

.kpi-right{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.kpi-card{
background:#eef3ff;
padding:12px 18px;
border-radius:10px;
min-width:170px;
text-align:right;
}

.kpi-card.forecast{
background:#ecfeff;
}

.kpi-label{
font-size:12px;
color:#475569;
}

.kpi-value{
font-size:19px;
font-weight:600;
color:#1e40af;
margin-top:4px;
}

/* FILTERS */

.filters{
display:flex;
gap:10px;
margin-top:10px;
}

.filters select{
padding:6px 8px;
border-radius:6px;
border:1px solid #cbd5e1;
font-size:13px;
}

/* TABLE */

.table-wrapper{
overflow-x:auto;
padding:0 12px 30px;
}

.row{
display:grid;
grid-template-columns:
2fr 1.1fr 1fr .9fr .9fr .9fr .9fr 1fr 1.5fr;
gap:6px;
padding:10px;
min-width:1100px;
background:#fff;
border-bottom:1px solid var(--grid);
font-size:17px;
}

.row>div{
border-right:1px solid var(--grid);
padding-right:6px;
}

.row>div:last-child{border-right:none;}

.header{
background:var(--mol-blue);
color:#fff;
font-weight:bold;
border-radius:6px;
}

.card{
background:#fff;
border-radius:6px;
margin-top:10px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.customer{background:#eef3ff;}

.invoice{
padding-left:18px;
background:#E5FDEB;
border-left:3px solid rgba(26,127,55,.18);
font-size:15px;
}

.hidden{display:none;}

.on-account{
color:var(--success);
font-weight:bold;
}

.overdue{
color:var(--danger);
font-weight:bold;
}

/* Inputs */

.row input{
height:34px;
padding:6px 8px;
font-size:13px;
border-radius:6px;
border:1px solid #cbd5e1;
width:100%;
}

/* DASHBOARD */

#dashboard{
padding:20px 12px 50px;
max-width:1200px;
margin:0 auto;
}

#dashboard h2{
text-align:center;
color:var(--mol-blue);
margin-bottom:25px;
font-weight:600;
}

.dashboard-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:20px;
}

.chart-box{
background:#fff;
padding:16px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.06);
border:1px solid rgba(0,0,0,.04);
height:320px;
}

.chart-box.tall{height:380px;}

.chart-box canvas{
width:100%!important;
height:100%!important;
}

/* MOBILE */

@media(max-width:768px){

.kpi-header{
flex-direction:column;
text-align:center;
gap:12px;
}

.kpi-right{
width:100%;
}

.kpi-card{
flex:1;
text-align:center;
padding:10px 8px;
}

.row{
font-size:14px;
}

.dashboard-grid{
grid-template-columns:1fr;
}

}

/* DRAWER */

.drawer{
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
z-index:10000;
}

.drawer.hidden{display:none;}

.drawer-content{
position:absolute;
bottom:0;
left:0;
right:0;
background:#fff;
padding:16px;
border-radius:14px 14px 0 0;
max-height:90vh;
overflow-y:auto;
}

.drawer-actions{
display:flex;
gap:10px;
margin-top:10px;
}

.drawer-actions button{
flex:1;
padding:10px;
font-size:15px;
}

.drawer-actions .primary{
background:var(--mol-blue);
color:#fff;
border:none;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:var(--mol-blue);
color:#fff;
padding:10px 18px;
border-radius:20px;
display:none;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-overlay" id="loginOverlay">

<div class="login-box">

<img src="https://raw.githubusercontent.com/Aditya-tiwariMOL/outstanding-dashboard/main/MOL%20Logo%2001.png">

<h2>MOL LOGISTICS (INDIA) PVT LTD</h2>

<input type="password" id="pwd" placeholder="Enter access code">

<button onclick="checkPassword()">Submit</button>

<div class="login-error" id="loginError">Invalid access code</div>

</div>
</div>

<!-- APP -->

<div id="appContainer" style="display:none;">

<!-- HEADER -->

<div class="kpi-header">

<div class="kpi-left">
<h1>Outstanding Receivables</h1>
<div class="updated" id="lastUpdated">—</div>

<div class="filters">
<select id="regionFilter" onchange="applyFilters()">
<option value="">All Regions</option>
</select>

<select id="categoryFilter" onchange="applyFilters()">
<option value="">All Categories</option>
</select>
</div>

</div>

<div class="kpi-right">

<div class="kpi-card">
<div class="kpi-label">Net Outstanding</div>
<div class="kpi-value" id="netOutstanding">—</div>
</div>

<div class="kpi-card forecast">
<div class="kpi-label">Forecast Receivables</div>
<div class="kpi-value" id="forecastOutstanding">—</div>
</div>

</div>
</div>

<!-- TABLE -->

<div class="table-wrapper">

<div class="row header">
<div>Name</div><div>Total OS</div><div>On Acc</div>
<div>90+</div><div>60+</div><div>30+</div><div>1+</div>
<div>Fcst</div><div>Remark</div>
</div>

<div id="app"></div>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

<h2>Dashboard Summary</h2>

<div class="dashboard-grid">

<div class="chart-box">
<canvas id="ageingChart"></canvas>
</div>

<div class="chart-box">
<canvas id="picChart"></canvas>
</div>

</div>

<div class="chart-box tall">
<canvas id="defaulterChart"></canvas>
</div>

</div>

</div>

<div class="toast" id="toast">Updated</div>

<script>

/* CONFIG */

let preloadedData=null;
let filteredData=null;

const API_URL="YOUR_WEBAPP_URL";

/* HELPERS */

const n=v=>Number(v||0);
const fmt=v=>n(v).toLocaleString();
const sum=t=>n(t["90+"])+n(t["61-90"])+n(t["31-60"])+n(t["1-30"]);

/* LOGIN */

async function sha256(t){
const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

async function checkPassword(){

if(await sha256(pwd.value.trim())!==PASSWORD_HASH){
loginError.style.display="block";return;
}

loginOverlay.style.display="none";
appContainer.style.display="block";

preloadedData=await fetch(API_URL).then(r=>r.json());

setupFilters(preloadedData);

filteredData=[...preloadedData];

renderAll();

}

/* FILTERS */

function setupFilters(data){

const regions=new Set();
const cats=new Set();

data.forEach(p=>{
Object.values(p.customers).forEach(c=>{
if(c.region)regions.add(c.region);
if(c.category)cats.add(c.category);
});
});

regions.forEach(r=>{
regionFilter.innerHTML+=`<option>${r}</option>`;
});

cats.forEach(c=>{
categoryFilter.innerHTML+=`<option>${c}</option>`;
});

}

function applyFilters(){

const r=regionFilter.value;
const c=categoryFilter.value;

filteredData=preloadedData.map(p=>{

const custs={};

Object.values(p.customers).forEach(x=>{

if((!r||x.region===r)&&(!c||x.category===c)){
custs[x.customerName]=x;
}

});

return {...p,customers:custs};

}).filter(p=>Object.keys(p.customers).length);

renderAll();

}

/* SUMMARY */

function updateSummary(data){

let t=0,o=0,f=0;

data.forEach(p=>{
t+=sum(p.totals);

Object.values(p.customers).forEach(c=>{
o+=n(c.onAccount);
f+=n(c.forecast);
});
});

netOutstanding.innerText="₹"+fmt(t-o);
forecastOutstanding.innerText="₹"+fmt(f);

lastUpdated.innerText=new Date().toLocaleString();
}

/* RENDER */

function renderAll(){
render(filteredData);
updateSummary(filteredData);
renderDashboard(filteredData);
}

/* TABLE */

function render(data){

app.innerHTML="";

data.forEach(pic=>{

const card=document.createElement("div");
card.className="card";

const picRow=document.createElement("div");
picRow.className="row";

picRow.innerHTML=`
<div>${pic.salesPIC}</div>
<div>${fmt(sum(pic.totals))}</div>
<div></div>
<div>${fmt(pic.totals["90+"])}</div>
<div>${fmt(pic.totals["61-90"])}</div>
<div>${fmt(pic.totals["31-60"])}</div>
<div>${fmt(pic.totals["1-30"])}</div>
<div></div><div></div>
`;

const wrap=document.createElement("div");
wrap.className="hidden";

picRow.onclick=()=>wrap.classList.toggle("hidden");

Object.values(pic.customers).forEach(c=>{

const r=document.createElement("div");
r.className="row customer";

r.innerHTML=`

<div>${c.customerName}</div>
<div>${fmt(sum(c.totals))}</div>
<div class="on-account">${fmt(c.onAccount)}</div>
<div>${fmt(c.totals["90+"])}</div>
<div>${fmt(c.totals["61-90"])}</div>
<div>${fmt(c.totals["31-60"])}</div>
<div>${fmt(c.totals["1-30"])}</div>

<div>
<input value="${c.forecast||''}"
onchange="saveForecast('${pic.salesPIC}','${c.customerName}',this.value)">
</div>

<div>
<input maxlength="60"
value="${c.remark||''}"
onchange="saveRemark('${pic.salesPIC}','${c.customerName}',this.value)">
</div>
`;

wrap.appendChild(r);

});

card.appendChild(picRow);
card.appendChild(wrap);
app.appendChild(card);

});

}

/* API */

function saveForecast(pic,cust,val){

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"updateForecast",
salesPIC:pic,
customer:cust,
forecast:n(val)
})
}).then(()=>reload());

}

function saveRemark(pic,cust,val){

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"updateRemark",
salesPIC:pic,
customer:cust,
remark:val.substring(0,60)
})
}).then(()=>reload());

}

function reload(){
fetch(API_URL).then(r=>r.json()).then(d=>{
preloadedData=d;
applyFilters();
toast.style.display="block";
setTimeout(()=>toast.style.display="none",1500);
});
}

</script>
</body>
</html>
